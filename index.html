<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>GHOST TRAIL</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #07140c;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      user-select: none;
      touch-action: none;
    }

    #gameWrap {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #173b22 0%, #07140c 75%);
    }

    canvas {
      width: min(100vw, calc(100vh * 9 / 16));
      height: min(100vh, calc(100vw * 16 / 9));
      background: #102817;
      box-shadow: 0 0 30px rgba(0,0,0,0.55);
      touch-action: none;
    }

    .controls {
      position: absolute;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      width: min(96vw, calc(96vh * 9 / 16));
      display: flex;
      justify-content: flex-end;
      align-items: flex-end;
      pointer-events: none;
    }

    .controls.hidden {
      display: none;
    }

    .topControls {
      position: absolute;
      top: auto;
      bottom: 112px;
      right: max(14px, calc((100vw - min(100vw, calc(100vh * 9 / 16))) / 2 + 14px));
      display: flex;
      gap: 10px;
      pointer-events: auto;
    }

    .topControls.hidden {
      display: none;
    }

    .btn.small {
      width: auto;
      min-width: 82px;
      height: 46px;
      border-radius: 15px;
      padding: 0 14px;
      font-size: 14px;
    }

    .padGroup {
      display: flex;
      gap: 12px;
      pointer-events: auto;
    }

    .btn {
      width: 76px;
      height: 76px;
      border-radius: 22px;
      border: 2px solid rgba(255,255,255,0.35);
      background: rgba(0,0,0,0.38);
      color: #fff;
      font-weight: 900;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 18px rgba(0,0,0,0.35);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }

    .btn.active,
    .btn:active {
      transform: scale(0.96);
      background: rgba(255,255,255,0.18);
    }

    .btn.hidden {
      display: none;
    }

    .btn.attack {
      width: 92px;
      height: 92px;
      border-radius: 28px;
      font-size: 15px;
      background: rgba(64, 130, 52, 0.58);
    }

    .btn.evade {
      width: 82px;
      height: 82px;
      border-radius: 26px;
      font-size: 15px;
      background: rgba(50, 95, 145, 0.58);
    }

    @media (max-width: 420px) {
      .btn {
        width: 64px;
        height: 64px;
        font-size: 16px;
      }

      .btn.attack {
        width: 78px;
        height: 78px;
        font-size: 13px;
      }

      .btn.evade {
        width: 72px;
        height: 72px;
        font-size: 13px;
      }

      .btn {
        backdrop-filter: none;
        -webkit-backdrop-filter: none;
      }

      canvas {
        box-shadow: none;
      }
    }
  </style>
</head>

    function imageReady(key) {
      const img = IMAGES[key];
      return img && img.complete && img.naturalWidth > 0;
    }

    function drawAsset(key, x, y, w, h, rot = 0, alpha = 1) {
      if (!imageReady(key)) return false;

      const img = IMAGES[key];

      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.translate(x, y);
      ctx.rotate(rot);
      ctx.drawImage(img, -w / 2, -h / 2, w, h);
      ctx.restore();

      return true;
    }

    function drawAnimatedAsset(key, x, y, w, h, options = {}) {
      if (!imageReady(key)) return false;

      const meta = SPRITE_META[key];
      if (!meta) return false;

      const img = IMAGES[key];
      const rot = options.rot || 0;
      const alpha = options.alpha ?? 1;
      const age = options.age || 0;
      const seed = options.seed || 0;
      const frame = Math.floor((age + seed) * meta.fps) % meta.frames;
      const sx = (frame % meta.cols) * (img.naturalWidth / meta.cols);
      const sy = Math.floor(frame / meta.cols) * (img.naturalHeight / meta.rows);
      const sw = img.naturalWidth / meta.cols;
      const sh = img.naturalHeight / meta.rows;

      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.translate(x, y);
      ctx.rotate(rot);
      ctx.drawImage(img, sx, sy, sw, sh, -w / 2, -h / 2, w, h);
      ctx.restore();

      return true;
    }

    function setLoopFade(key, target, seconds = 0.65, resetOnStop = false) {
      const audio = LOOP_SOUNDS[key];

      LOOP_FADE[key] = {
        target: clamp(target, 0, LOOP_BASE_VOLUME[key] || 1),

    function updateLoopFades(dt) {
      for (const key in LOOP_FADE) {
        const audio = LOOP_SOUNDS[key];
        const fade = LOOP_FADE[key];
        if (!audio || !fade) continue;

        const diff = fade.target - audio.volume;
        const step = fade.speed * dt;

        if (Math.abs(diff) <= step) {
          audio.volume = fade.target;
          delete LOOP_FADE[key];

          if (audio.volume <= 0.001) {
            audio.pause();
            if (fade.resetOnStop) {
              try {
                audio.currentTime = 0;
              } catch (err) {}
            }
          }
        } else {
          audio.volume += Math.sign(diff) * step;
        }
      }
    }

    function playSound(type) {
      if (!soundEnabled) return;

      const fileSound = SOUNDS[type];
      if (fileSound) {
        try {
          const nowMs = performance.now();
          const priority = SOUND_PRIORITY[type] || 1;
          const lockMs = SOUND_LOCK_MS[type] || 120;
          const lastAt = lastSoundAt[type] || 0;

          if (type === "enemyHit" && nowMs - lastAt < lockMs) return;
          if (priority < activeSoundPriority && nowMs < activeSoundLockUntil) return;

          if (type === "enemyHit" && !fileSound.paused && fileSound.currentTime < 0.16) {
            return;
          }

          if (priority >= SOUND_PRIORITY.enemyDefeat) {
            for (const key in SOUNDS) {
              if (key !== type && (SOUND_PRIORITY[key] || 0) < priority) {
                if (type === "bossDefeat") {
                  SOUNDS[key].pause();
                  SOUNDS[key].currentTime = 0;
                }
              }
            }
          }

          fileSound.pause();
          fileSound.currentTime = 0;
          fileSound.play().catch(() => {});
          lastSoundAt[type] = nowMs;
          activeSoundPriority = priority;
          activeSoundLockUntil = nowMs + lockMs;

          window.setTimeout(() => {
            if (performance.now() >= activeSoundLockUntil) {
              activeSoundPriority = 0;
            }
          }, lockMs + 20);
          return;
        } catch (err) {}
      }

      if (SILENT_FALLBACK_SOUNDS.has(type)) return;

      try {
        audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === "suspended") audioCtx.resume();

        const now = audioCtx.currentTime;
        const master = audioCtx.createGain();
        master.gain.setValueAtTime(0.0001, now);
        const fallbackPeak = type === "clear" || type === "power" || type === "start" ? 0.04 : 0.08;
        master.gain.exponentialRampToValueAtTime(fallbackPeak, now + 0.012);
        master.gain.exponentialRampToValueAtTime(0.0001, now + 0.28);
        master.connect(audioCtx.destination);

        const notes = {
          select: [660, 880],
          start: [420, 620, 920],
          hit: [220, 140],
          defeat: [720, 980, 1320],
          power: [620, 920, 1240],
          clear: [520, 780, 1040, 1320],
        }[type] || [440];

        notes.forEach((freq, i) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          const t = now + i * 0.055;
          osc.type = type === "hit" ? "sawtooth" : "triangle";
          osc.frequency.setValueAtTime(freq, t);
          gain.gain.setValueAtTime(0.0001, t);
          const notePeak = type === "hit" ? 0.09 : (type === "clear" || type === "power" || type === "start" ? 0.034 : 0.06);
          gain.gain.exponentialRampToValueAtTime(notePeak, t + 0.01);
          gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.12);
          osc.connect(gain);
          gain.connect(master);
          osc.start(t);
          osc.stop(t + 0.14);
        });
      } catch (err) {}

          snap.stageId,

            hp: Math.max(3, snap.hp),
            weaponLevel: Math.max(4, snap.weaponLevel || 1),
            bonusHealChance: snap.bonusHealChance || 0,
            loopCount: snap.loopCount || 1,
            continueUsed: true,
            continueSnapshot: snap,
            routeHistory: snap.routeHistory || [snap.stageId],
          },
          snap.score
        );
        this.continueUsed = true;
        this.continueSnapshot = snap;
        this.player.invuln = 2.0;
        this.showMessage(this.t("コンティニュー！", "Continue!"), 1.2);
        this.state = "playing";
      }

      clearStage() {
        this.bestScore = Math.max(this.bestScore, this.score);
        localStorage.setItem("branchQuestBest", String(this.bestScore));
        stopLoopSound("attack", true, true);
        quietShortSounds(260);
        this.addFlash("rgba(255,255,180,", 0.35);
        this.addShake(10);
        this.addStageClearBurst();
        this.state = this.stage.clearMode === "branch" ? "branch" : "complete";
        playSound(!this.stage.nextStage ? "clear" : "power");
        if (!this.clearRecorded && !this.stage.nextStage) {
          this.lastClearResult = this.getClearResult();
          this.saveRanking(this.lastClearResult);
          this.clearRecorded = true;
        }
        if (this.state === "branch" && !this.selectedRouteId) {
          this.chooseRoute(this.stage.routeOptions?.[0]?.id || "river2");
        }
      }

      addStageClearBurst() {
        const p = this.player || { x: W / 2, y: H * 0.68 };
        const color = this.stageId === "castleFinal"
          ? "rgba(255,95,110,0.92)"
          : (this.stageId === "worldTree5" ? "rgba(145,255,185,0.9)" : "rgba(255,240,130,0.9)");

        this.addShockwave(p.x, p.y, 170, 0.62, color, 8);
        this.addShockwave(p.x, p.y, 285, 0.82, "rgba(255,255,255,0.48)", 5);
        this.addFloatingText(this.t("STAGE CLEAR!", "STAGE CLEAR!"), p.x, p.y - 92, "#fff2a8");

        for (let i = 0; i < effectCount(48); i++) {
          const a = rand(0, Math.PI * 2);
          const s = rand(80, 360);
          this.addParticle({
            x: p.x + rand(-34, 34),
            y: p.y + rand(-30, 30),
            vx: Math.cos(a) * s,
            vy: Math.sin(a) * s - rand(80, 180),
            life: rand(0.45, 0.95),
            color: i % 3 === 0 ? "rgba(255,255,255,0.92)" : color,
            size: rand(4, 12),
            type: i % 2 === 0 ? "diamond" : "spark",
            gravity: rand(120, 220),
            rotSpeed: rand(-10, 10),
          });
        }
      }

      getClearResult(status = "clear") {
        return {
          score: this.score,
          loop: this.loopCount,
          stage: this.stageName,
          status,
          final: status === "clear" && !this.stage.nextStage && this.stage.clearMode === "complete",
        };
      }

      saveRanking(result) {
        const record = {
          score: result.score,
          loop: result.loop,
          stage: result.stage,
          status: result.status || "clear",
          final: result.final,
        };
        this.rankings = [record, ...this.rankings]
          .sort((a, b) => b.score - a.score)
          .slice(0, 5);
        localStorage.setItem("branchQuestRankings", JSON.stringify(this.rankings));
      }

      update(dt) {
        dt = Math.min(dt, 0.033);

        if (this.state === "pause") {
          return;
        }

        if (this.state !== "playing") {
          this.shake = Math.max(0, this.shake - 30 * dt);
          this.flashAlpha = Math.max(0, this.flashAlpha - 1.1 * dt);
          this.updateParticles(dt);
          this.updateFloatingTexts(dt);
          this.updateShockwaves(dt);
          this.updateSlashes(dt);
          return;
        }

        this.elapsed += dt;

        this.shake = Math.max(0, this.shake - 36 * dt);
        this.flashAlpha = Math.max(0, this.flashAlpha - 1.4 * dt);
        this.warningTimer = Math.max(0, this.warningTimer - dt);

        const scrollSpeed = this.getScrollSpeed();

        this.bgScroll += scrollSpeed * dt;

        if (this.getProgress() < 1) {
          this.distance += scrollSpeed * dt;
        }

        const p = this.player;
        p.y = p.fixedY;
        p.invuln = Math.max(0, p.invuln - dt);
        p.attackCooldown = Math.max(0, p.attackCooldown - dt);
        p.evadeCooldown = Math.max(0, p.evadeCooldown - dt);

        if (p.overdriveTime > 0) {
          p.overdriveTime = Math.max(0, p.overdriveTime - dt);
          p.invuln = Math.max(p.invuln, p.overdriveTime);
        }
        p.weaponDropBlockTime = Math.max(0, p.weaponDropBlockTime - dt);

        if (this.messageTimer > 0) {
          this.messageTimer -= dt;
        }
        this.bulletBreakSoundTimer = Math.max(0, this.bulletBreakSoundTimer - dt);

        this.updatePlayer(dt);

        this.tryAttack();

        this.updateSpawning(dt);
        this.updateObstacles(dt);
        this.updatePowerups(dt);
        this.updateBoss(dt);
        this.updateBullets(dt);
        this.updateEnemyBullets(dt);
        this.updateEnemies(dt);
        this.updateParticles(dt);
        this.updateFloatingTexts(dt);
        this.updateShockwaves(dt);
        this.updateSlashes(dt);
        this.updateAmbientEffects(dt);
        this.checkCollisions();

        if (this.getProgress() >= 1 && !this.bossDefeated && !this.goalLockedMessageShown) {
          this.goalLockedMessageShown = true;
          this.showMessage(this.t("中ボス撃破でクリア！", "Defeat the boss to clear!"), 2.0);
        }

        if (this.canClearStage()) {
          this.clearStage();
        }
      }

      updatePlayer(dt) {
        const p = this.player;

        let dir = 0;
        if (isLeftPressed()) dir -= 1;
        if (isRightPressed()) dir += 1;

        if (p.evadeTime > 0) {
          p.evadeTime -= dt;
          p.x += p.evadeDir * 940 * dt;
          p.invuln = Math.max(p.invuln, 0.12);

          const evadeTrailCount = Math.random() < TRAIL_QUALITY ? (IS_MOBILE_DISPLAY ? 1 : 3) : 0;
          for (let i = 0; i < evadeTrailCount; i++) {
            this.addParticle({
              x: p.x + rand(-20, 20),
              y: p.y + rand(-20, 20),
              vx: rand(-60, 60),
              vy: rand(40, 150),
              life: 0.28,
              color: "rgba(120,220,255,0.75)",
              size: rand(4, 10),
              type: "circle",
            });
          }
        } else if (isTouchMoveActive()) {
          const targetX = clamp(input.touchTargetX, 70, W - 70);
          const dx = targetX - p.x;
          const deadZone = IS_MOBILE_DISPLAY ? 8 : 4;
          if (Math.abs(dx) > deadZone) {
            const followSpeed = IS_MOBILE_DISPLAY ? 520 : 700;
            const step = Math.sign(dx) * Math.min(Math.abs(dx), followSpeed * dt);
            p.x += step;
          }
        } else {
          p.x += dir * p.speed * dt;
        }

        p.x = clamp(p.x, 70, W - 70);
        p.y = p.fixedY;
      }

      getAimDirection() {
        const p = this.player;
        let target = null;
        let best = Infinity;

        for (const o of this.obstacles) {
          const d = dist2(p.x, p.y, o.x, o.y);
          if (d < best && o.y < p.y + 160) {
            best = d;
            target = o;
          }
        }

        for (const e of this.enemies) {
          const d = dist2(p.x, p.y, e.x, e.y);
          if (d < best) {
            best = d;
            target = e;
          }
        }

        if (this.boss && this.boss.active) {
          const d = dist2(p.x, p.y, this.boss.x, this.boss.y);
          if (d < best) {
            target = this.boss;
          }
        }

        if (!target) {
          return { x: 0, y: -1 };
        }

        const dx = target.x - p.x;
        const dy = target.y - p.y;
        const len = Math.max(1, Math.sqrt(dx * dx + dy * dy));

        return {
          x: dx / len,
          y: dy / len,
        };
      }

      tryAttack() {
        const p = this.player;
        if (this.state !== "playing") return;
        if (p.attackCooldown > 0) return;

        const lv = p.weaponLevel;
        const cooldowns = [0, 0.26, 0.23, 0.2, 0.17, 0.14];
        p.attackCooldown = cooldowns[lv] || 0.2;

        const aim = this.getAimDirection();
        const baseAngle = Math.atan2(aim.y, aim.x);
        const speed = 800 + lv * 40;

        this.addSlash(p.x, p.y - 14, baseAngle, 55 + lv * 6, 0.18, "rgba(190,255,120,0.75)");
        this.addShockwave(p.x, p.y - 18, 28 + lv * 6, 0.18, "rgba(190,255,130,0.55)", 4);

        const fireByAngle = (angle, dmg, r) => {
          this.fireBullet(
            p.x,
            p.y - 18,
            Math.cos(angle) * speed,
            Math.sin(angle) * speed,
            dmg,
            r
          );
        };

        const fireLevel4Pattern = () => {
          fireByAngle(baseAngle, 1.5, 10);
          fireByAngle(baseAngle - 0.2, 1.1, 8);
          fireByAngle(baseAngle + 0.2, 1.1, 8);
          fireByAngle(baseAngle - 0.08, 0.8, 6);
          fireByAngle(baseAngle + 0.08, 0.8, 6);
        };

        if (lv === 1) {
          fireByAngle(baseAngle, 1, 8);
        } else if (lv === 2) {
          fireByAngle(baseAngle - 0.08, 1, 8);
          fireByAngle(baseAngle + 0.08, 1, 8);
        } else if (lv === 3) {
          fireByAngle(baseAngle, 1.3, 9);
          fireByAngle(baseAngle - 0.16, 1, 8);
          fireByAngle(baseAngle + 0.16, 1, 8);
        } else if (lv === 4) {
          fireLevel4Pattern();
        } else {
          fireLevel4Pattern();

          for (let i = 0; i < 10; i++) {
            const angle = -Math.PI / 2 + i * Math.PI * 2 / 10;
            const forwardArc = Math.abs(Math.atan2(Math.sin(angle - baseAngle), Math.cos(angle - baseAngle))) < 0.28;
            if (forwardArc) continue;
            fireByAngle(angle, i % 2 === 0 ? 1.0 : 0.75, i % 2 === 0 ? 9 : 7);
          }

          this.addShockwave(p.x, p.y - 12, 95, 0.28, "rgba(255,245,120,0.78)", 6);
        }

        for (let i = 0; i < 12; i++) {
          this.addParticle({
            x: p.x + rand(-14, 14),
            y: p.y - 25,
            vx: rand(-120, 120),
            vy: rand(-220, -80),
            life: rand(0.16, 0.32),
            color: "rgba(190,255,120,0.9)",
            size: rand(3, 8),
            type: Math.random() < 0.5 ? "circle" : "spark",
          });
        }
      }

      tryEvade() {
        const p = this.player;
        if (this.state !== "playing") return;
        if (p.evadeCooldown > 0) return;

        let dir = 0;
        if (isLeftPressed()) dir -= 1;
        if (isRightPressed()) dir += 1;

        if (dir === 0) {
          dir = p.x < W / 2 ? 1 : -1;
        }

        p.evadeDir = dir;
        p.evadeTime = 0.22;
        p.evadeCooldown = 1.25;
        p.invuln = 0.58;

        this.addShockwave(p.x, p.y, 78, 0.35, "rgba(120,220,255,0.65)", 5);
        this.addSlash(p.x, p.y, dir > 0 ? 0 : Math.PI, 85, 0.2, "rgba(120,220,255,0.72)");
        this.showMessage(this.t("回避！", "Evade!"), 0.45);
      }

      fireBullet(x, y, vx, vy, dmg, r) {
        this.bullets.push({
          x,
          y,
          vx,
          vy,
          dmg,
          r,
          life: 1.25,
          angle: Math.atan2(vy, vx),
        });
      }

      fireEnemyBullet(x, y, vx, vy, r = 10, dmg = 1) {
        const p = this.player;

        if (p && Math.abs(y - p.y) < 72 && Math.abs(vy) < 90 && Math.abs(vx) > 120) {
          return;
        }

        const relief = this.getWeaponRelief();

        this.enemyBullets.push({
          x,
          y,
          vx: vx * ENEMY_BULLET_SPEED_MULTIPLIER * relief.speed,
          vy: vy * ENEMY_BULLET_SPEED_MULTIPLIER * relief.speed,
          r,
          dmg,
          unbreakable: Math.random() < (this.stage.unbreakableBulletChance || 0) * relief.shot,
          life: 10,
        });
      }

      updateSpawning(dt) {
        const progress = this.getProgress();

        if (!this.bossSpawned && progress >= (this.stage.bossAt ?? 0.65)) {
          this.spawnBoss();
          return;
        }

        this.spawnTimer -= dt;
        const bossActive = this.boss && this.boss.active;

        if (this.spawnTimer <= 0) {
          const intervalBase = bossActive
            ? rand(this.stage.bossInterval[0], this.stage.bossInterval[1]) * BOSS_ACTIVE_SPAWN_INTERVAL_MULTIPLIER
            : (rand(this.stage.enemyInterval[0], this.stage.enemyInterval[1]) - progress * 0.16) * ENEMY_SPAWN_INTERVAL_MULTIPLIER;

          this.spawnTimer = Math.max(this.stageId === "forest1" ? 0.16 : 0.24, intervalBase / this.getLoopSpawnMultiplier());

          if (!bossActive || Math.random() < 0.52) {
            this.spawnEnemy();

            if (!bossActive && progress > 0.2 && Math.random() < this.stage.extraEnemyBase + EXTRA_ENEMY_CHANCE_BONUS + progress * this.stage.extraEnemyScale) {
              this.spawnEnemy();
              if (this.stageId === "forest1" && progress > 0.34 && Math.random() < 0.32 + progress * 0.2) {
                this.spawnEnemy();
              }
            }
          }
        }

        this.powerTimer -= dt;

        if (this.powerTimer <= 0) {
          this.spawnPowerup();
          this.powerTimer = rand(this.stage.powerInterval[0], this.stage.powerInterval[1]);
        }

        this.obstacleTimer = 999;
      }

      spawnEnemy(type = "") {
        const progress = this.getProgress();

        if (!type) {
          const pools = this.stage.enemyPools || STAGE_CONFIGS.forest1.enemyPools;
          const pool = progress < 0.25 ? pools.early : progress < 0.55 ? pools.mid : pools.late;
          type = pool[Math.floor(Math.random() * pool.length)];
        }

        const allowBottom = this.stage.allowBottomAttacks !== false;
        const edgeRoll = Math.random();
        let x;
        let y;

        if (!allowBottom) {
          if (edgeRoll < 0.48) {
            x = rand(80, W - 80);
            y = -80;
          } else if (edgeRoll < 0.74) {
            x = -80;
            y = this.getSafeSideSpawnY();
          } else {
            x = W + 80;
            y = this.getSafeSideSpawnY();
          }
        } else if (edgeRoll < 0.42) {
          x = rand(80, W - 80);
          y = -80;
        } else if (edgeRoll < 0.7) {
          x = -80;
          y = this.getSafeSideSpawnY();
        } else if (edgeRoll < 0.97) {
          x = W + 80;
          y = this.getSafeSideSpawnY();
        } else {
          x = rand(100, W - 100);
          y = H + 80;
        }

        const base = {
          x,
          y,
          age: 0,
          r: IS_MOBILE_DISPLAY ? 30 : 24,
          hp: 2,
          maxHp: 2,
          type,
          score: 100,
          hitFlash: 0,
          shootTimer: rand(1.2, 2.2),
          speed: 130,
          wobble: rand(0, Math.PI * 2),
        };

        if (type === "slime" || type === "slimeAlt" || type === "splitSlime") {
          base.r = 26;
          base.hp = base.maxHp = Math.ceil((2 + Math.floor(progress * 1)) * this.stage.difficulty);
          base.speed = (120 + progress * 45) * (0.92 + this.stage.difficulty * 0.08);
          base.score = 100;
        }

        if (type === "splitSlime") {
          base.r = 30;
          base.hp = base.maxHp = Math.ceil(3 * this.stage.difficulty);
          base.speed *= 0.82;
          base.score = 180;
        }

        if (type === "slimeAlt") {
          base.r = 28;
          base.hp = base.maxHp = Math.ceil(3 * this.stage.difficulty);
          base.speed *= 0.94;
          base.score = 120;
        }

        if (type === "bat" || type === "swarmBat") {
          base.r = 23;
          base.hp = base.maxHp = Math.ceil(2 * this.stage.difficulty);
          base.speed = (155 + progress * 55) * (0.92 + this.stage.difficulty * 0.08);
          base.score = 130;
        }

        if (type === "swarmBat") {
          base.r = 29;
          base.hp = base.maxHp = Math.ceil(2 * this.stage.difficulty);
          base.speed = (195 + progress * 62) * (0.92 + this.stage.difficulty * 0.08);
          base.score = 170;
        }

        if (type === "boar" || type === "boarAlt" || type === "charger" || type === "guardBoar") {
          base.r = 30;
          base.hp = base.maxHp = Math.ceil(4 * this.stage.difficulty);
          base.speed = (180 + progress * 65) * (0.92 + this.stage.difficulty * 0.08);
          base.score = 180;
          base.chargeTimer = rand(0.45, 0.95);
        }

        if (type === "boarAlt") {
          base.r = 34;
          base.hp = base.maxHp = Math.ceil(5 * this.stage.difficulty);
          base.speed *= 0.9;
          base.score = 240;
        }

        if (type === "charger") {
          base.r = 32;
          base.hp = base.maxHp = Math.ceil(4 * this.stage.difficulty);
          base.speed = (150 + progress * 54) * (0.92 + this.stage.difficulty * 0.08);
          base.score = 260;
          base.chargeTimer = rand(0.32, 0.72);
          base.chargeBurst = 0;
        }

        if (type === "guardBoar") {
          base.r = 38;
          base.hp = base.maxHp = Math.ceil(6 * this.stage.difficulty);
          base.speed = (118 + progress * 38) * (0.92 + this.stage.difficulty * 0.08);
          base.score = 310;
          base.chargeTimer = rand(0.9, 1.45);
          base.chargeBurst = 0;
        }

        if (type === "mushroom" || type === "scatterMushroom") {
          base.r = 28;
          base.hp = base.maxHp = Math.ceil(3 * this.stage.difficulty);
          base.speed = (88 + progress * 24) * (0.92 + this.stage.difficulty * 0.08);
          base.score = 170;
          base.shootTimer = rand(1.4, 2.2);
        }

        if (type === "scatterMushroom") {
          base.r = 31;
          base.hp = base.maxHp = Math.ceil(4 * this.stage.difficulty);
          base.speed *= 0.82;
          base.score = 240;
          base.shootTimer = rand(1.65, 2.35);
        }

        if (type === "golemSlow" || type === "golemShooter" || type === "burstGolem") {
          base.r = 38;
          base.hp = base.maxHp = Math.ceil(7 * this.stage.difficulty);
          base.speed = (74 + progress * 18) * (0.92 + this.stage.difficulty * 0.08);
          base.score = 320;
        }

        if (type === "golemSlow") {
          base.r = 42;
          base.hp = base.maxHp = Math.ceil(8 * this.stage.difficulty);
          base.speed *= 0.64;
          base.score = 360;
        }

        if (type === "golemShooter") {
          base.r = 39;
          base.hp = base.maxHp = Math.ceil(6 * this.stage.difficulty);
          base.speed *= 0.72;
          base.score = 390;
          base.shootTimer = rand(1.25, 1.85);
        }

        if (type === "burstGolem") {
          base.r = 41;
          base.hp = base.maxHp = Math.ceil(7 * this.stage.difficulty);
          base.speed *= 0.58;
          base.score = 430;
          base.shootTimer = rand(1.7, 2.45);
        }

        const loopDifficulty = this.getLoopDifficultyMultiplier();
        base.r = Math.max(ENEMY_MIN_RADIUS, Math.round(base.r * (this.stage.enemySizeMultiplier || 1.1)));
        const typeHpMultiplier =
          type === "golemSlow" || type === "golemShooter" ? 0.7 :
          type === "burstGolem" ? 0.68 :
          type === "boarAlt" || type === "charger" || type === "guardBoar" ? 0.68 :
          ENEMY_HP_MULTIPLIER;
        base.hp = base.maxHp = Math.max(1, Math.ceil(base.maxHp * loopDifficulty * typeHpMultiplier));
        if (this.stage.enemyHpMultiplier) {
          base.hp = base.maxHp = Math.max(1, Math.ceil(base.maxHp * this.stage.enemyHpMultiplier));
        }
        const relief = this.getWeaponRelief();
        const extraLoops = Math.max(0, this.loopCount - 1);
        base.hp = base.maxHp = Math.max(1, Math.ceil(base.maxHp * relief.hp));
        base.speed *= (1 + extraLoops * 0.1 + extraLoops * extraLoops * 0.02) * ENEMY_SPEED_MULTIPLIER * relief.speed;
        base.score = Math.round(base.score * (this.stage.scoreMultiplier || 1) * this.getLoopScoreMultiplier());

        this.enemies.push(base);
      }

      getSafeSideSpawnY() {
        const p = this.player;
        const minY = 150;
        const maxY = H - 230;

        if (!p) return rand(minY, maxY);

        const safeGap = 150;
        const ranges = [
          [minY, p.y - safeGap],
          [p.y + safeGap, maxY],
        ].filter(([min, max]) => max > min);

        if (ranges.length === 0) return rand(minY, maxY);

        const total = ranges.reduce((sum, [min, max]) => sum + (max - min), 0);
        let pick = rand(0, total);

        for (const [min, max] of ranges) {
          const span = max - min;
          if (pick <= span) return rand(min, max);
          pick -= span;
        }

        return rand(ranges[0][0], ranges[0][1]);
      }

      spawnSplitlings(parent) {
        const baseAngle = rand(0, Math.PI * 2);

        for (let i = 0; i < 2; i++) {
          const angle = baseAngle + i * Math.PI + rand(-0.32, 0.32);
          this.enemies.push({
            x: parent.x + Math.cos(angle) * 24,
            y: parent.y + Math.sin(angle) * 24,
            age: rand(0, 0.3),
            r: Math.max(SPLITLING_MIN_RADIUS, Math.round(parent.r * 0.58)),
            hp: 1,
            maxHp: 1,
            type: i % 2 === 0 ? "slime" : "slimeAlt",
            score: Math.max(25, Math.round(parent.score * 0.22)),
            hitFlash: 0,
            shootTimer: rand(1.2, 2.2),
            speed: parent.speed * rand(1.18, 1.34),
            wobble: rand(0, Math.PI * 2),
          });
        }

        this.addShockwave(parent.x, parent.y, 78, 0.26, "rgba(145,255,120,0.58)", 4);
        this.addFloatingText(this.t("分裂！", "Split!"), parent.x, parent.y - 58, "#b8ff82");
      }

      spawnObstacleTree() {
        const lanes = [W * 0.34, W * 0.5, W * 0.66];
        const x = lanes[Math.floor(Math.random() * lanes.length)] + rand(-28, 28);

        this.obstacles.push({
          x,
          y: -90,
          r: 42,
          hp: 2,
          maxHp: 2,
          age: 0,
          hitFlash: 0,
          burning: 0,
          score: 80,
        });
      }

      spawnPowerup() {
        let type = "weapon";
        const canHeal = this.player.hp < this.player.maxHp;
        const weaponBlocked = this.player.overdriveTime > 0 || this.player.weaponDropBlockTime > 0;

        const healChance = Math.min(0.95, this.stage.healChance + (this.stageBonusHealChance || 0));

        if (canHeal && Math.random() < healChance) {
          type = "heal";
        } else if (Math.random() < this.stage.overdriveChance) {
          type = "overdrive";
        } else if (weaponBlocked) {
          if (canHeal) {
            type = "heal";
          } else {
            return;
          }
        }

        this.powerups.push({
          x: rand(110, W - 110),
          y: -40,
          r: 24,
          type,
          age: 0,
          life: 12,
        });
      }

      spawnBoss() {
        this.bossSpawned = true;
        playSound("warning");
        this.showMessage(this.t("中ボス出現！ ", "Boss appears! ") + this.getBossDisplayName(), 2.2);
        const drama = this.getBossDrama();
        this.addFlash(drama.flash, drama.flashAlpha);
        this.addShake(drama.shake);
        this.warningTimer = drama.warningTime;

        this.boss = {
          active: true,
          x: W / 2,
          y: 300,
          r: 86,
          hp: Math.max(18, Math.round(this.stage.bossHp * this.getLoopDifficultyMultiplier() * BOSS_HP_MULTIPLIER)),
          maxHp: Math.max(18, Math.round(this.stage.bossHp * this.getLoopDifficultyMultiplier() * BOSS_HP_MULTIPLIER)),
          age: 0,
          shootTimer: 1.2,
          summonTimer: 3.0,
          hitFlash: 0,
        };

        this.addShockwave(W / 2, 300, 210 + drama.power * 80, 0.75 + drama.power * 0.18, drama.waveColor, 6 + drama.power * 3);

        for (let i = 0; i < Math.round(18 + drama.power * 22); i++) {
          const angle = rand(0, Math.PI * 2);
          const speed = rand(110, 330 + drama.power * 90);
          this.addParticle({
            x: W / 2 + rand(-80, 80),
            y: 300 + rand(-45, 45),
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: rand(0.4, 0.95),
            color: drama.particleColor,
            size: rand(4, 10 + drama.power * 4),
            type: i % 3 === 0 ? "diamond" : "spark",
            gravity: rand(20, 110),
            rotSpeed: rand(-9, 9),
          });
        }
      }

      getBossDrama() {
        const order = ["forest1", "river2", "cave2", "ruins3", "mountain4", "fog4", "worldTree5", "castleFinal"];
        const index = Math.max(0, order.indexOf(this.stageId));
        const power = clamp(0.45 + index * 0.1, 0.45, 1.2);
        const castle = this.stageId === "castleFinal";

        return {
          power,
          shake: 8 + power * 14,
          warningTime: 1.45 + power * 0.65,
          flash: castle ? "rgba(255,70,90," : "rgba(255,255,150,",
          flashAlpha: 0.18 + power * 0.23,
          waveColor: castle ? "rgba(255,80,90,0.82)" : "rgba(255,240,120,0.75)",
          particleColor: castle ? "rgba(255,70,90,0.84)" : "rgba(255,235,120,0.78)",
        };
      }

      getLoopDifficultyMultiplier() {
        return 1 + Math.max(0, this.loopCount - 1) * 0.22;
      }

      getLoopScoreMultiplier() {
        return 1 + Math.max(0, this.loopCount - 1) * 0.18;
      }

      updateBoss(dt) {
        const b = this.boss;
        if (!b || !b.active) return;

        b.age += dt;
        b.hitFlash = Math.max(0, b.hitFlash - dt);

        b.x = W / 2 + Math.sin(b.age * 1.15) * 185;
        b.y = 300 + Math.sin(b.age * 1.6) * 24;

        b.shootTimer -= dt;

        if (b.shootTimer <= 0) {
          b.shootTimer = rand(0.75, 1.25);

          if (Math.random() <= (this.stage.bossShotChance ?? 1) * this.getWeaponRelief().shot) {
            const p = this.player;
            const dx = p.x - b.x;
            const dy = p.y - b.y;
            const len = Math.max(1, Math.sqrt(dx * dx + dy * dy));
            const spd = 315;

            this.fireEnemyBullet(
              b.x,
              b.y + 58,
              dx / len * spd,
              dy / len * spd,
              13,
              1
            );

            this.addShockwave(b.x, b.y + 45, 48, 0.25, "rgba(255,100,80,0.55)", 4);

            if (b.hp < b.maxHp * 0.5) {
              this.fireEnemyBullet(b.x - 45, b.y + 42, -75, 320, 10, 1);
              this.fireEnemyBullet(b.x + 45, b.y + 42, 75, 320, 10, 1);
            }
          }
        }

        b.summonTimer -= dt;

        if (b.summonTimer <= 0) {
          b.summonTimer = rand(3.0, 4.4);
          const pool = this.stage.enemyPools?.mid || ["slime", "bat"];
          this.spawnEnemy(pool[Math.floor(Math.random() * pool.length)]);
          this.showMessage(this.t("小さな敵を呼び出した！", "The boss summoned enemies!"), 1.0);
          this.addShockwave(b.x, b.y, 120, 0.38, "rgba(160,255,120,0.45)", 4);
        }
      }

      updateObstacles(dt) {
        const scrollSpeed = this.getScrollSpeed();

        for (let i = this.obstacles.length - 1; i >= 0; i--) {
          const o = this.obstacles[i];

          o.age += dt;
          o.hitFlash = Math.max(0, o.hitFlash - dt);
          o.burning = Math.max(0, o.burning - dt);
          o.y += scrollSpeed * dt;

          if (o.burning > 0) {
            this.addBurnParticles(o.x, o.y, 2);
          }

          if (o.y > H + 120) {
            this.obstacles.splice(i, 1);
          }
        }
      }

      updateBullets(dt) {
        for (let i = this.bullets.length - 1; i >= 0; i--) {
          const b = this.bullets[i];

          b.x += b.vx * dt;
          b.y += b.vy * dt;
          b.life -= dt;

          const trailCount = Math.random() < TRAIL_QUALITY ? (IS_MOBILE_DISPLAY ? 1 : 2) : 0;
          for (let t = 0; t < trailCount; t++) {
            this.addParticle({
              x: b.x - Math.cos(b.angle) * rand(0, 20),
              y: b.y - Math.sin(b.angle) * rand(0, 20),
              vx: rand(-30, 30),
              vy: rand(-30, 30),
              life: 0.16,
              color: "rgba(190,255,130,0.5)",
              size: rand(2, 5),
              type: "circle",
            });
          }

          if (b.life <= 0 || b.y < -100 || b.y > H + 100 || b.x < -100 || b.x > W + 100) {
            this.bullets.splice(i, 1);
          }
        }
      }

      updateEnemyBullets(dt) {
        for (let i = this.enemyBullets.length - 1; i >= 0; i--) {
          const b = this.enemyBullets[i];

          b.x += b.vx * dt;
          b.y += b.vy * dt;
          b.life -= dt;

          if (Math.random() < TRAIL_QUALITY) {
            this.addParticle({
              x: b.x,
              y: b.y,
              vx: rand(-20, 20),
              vy: rand(-20, 20),
              life: 0.14,
              color: "rgba(255,90,70,0.5)",
              size: rand(2, 5),
              type: "circle",
            });
          }

          if (b.life <= 0 || b.y > H + 100 || b.y < -100 || b.x < -100 || b.x > W + 100) {
            this.enemyBullets.splice(i, 1);
          }
        }
      }

      updateEnemies(dt) {
        const p = this.player;

        for (let i = this.enemies.length - 1; i >= 0; i--) {
          const e = this.enemies[i];

          e.age += dt;
          e.hitFlash = Math.max(0, e.hitFlash - dt);

          const dx = p.x - e.x;
          const dy = p.y - e.y;
          const len = Math.max(1, Math.sqrt(dx * dx + dy * dy));

          const moveX = dx / len;
          const moveY = dy / len;

          if (e.type === "slime" || e.type === "slimeAlt" || e.type === "splitSlime") {
            e.x += moveX * e.speed * dt;
            e.y += moveY * e.speed * dt;
          }

          if (e.type === "bat") {
            const sideMove = Math.sin(e.age * 6 + e.wobble) * 90;
            e.x += moveX * e.speed * dt + sideMove * dt;
            e.y += moveY * e.speed * dt;
          }

          if (e.type === "swarmBat") {
            const sideMove = Math.sin(e.age * 9 + e.wobble) * 145;
            e.x += moveX * e.speed * dt + sideMove * dt;
            e.y += moveY * e.speed * 0.9 * dt;
          }

          if (e.type === "boar" || e.type === "boarAlt") {
            const chargeSpeed = e.speed + Math.sin(e.age * 5) * 35;
            e.x += moveX * chargeSpeed * dt;
            e.y += moveY * chargeSpeed * dt;
          }

          if (e.type === "charger" || e.type === "guardBoar") {
            e.chargeTimer -= dt;
            e.chargeBurst = Math.max(0, (e.chargeBurst || 0) - dt);

            if (e.chargeTimer <= 0) {
              e.chargeTimer = e.type === "guardBoar" ? rand(1.55, 2.25) : rand(1.15, 1.85);
              e.chargeBurst = e.type === "guardBoar" ? 0.42 : 0.34;
              this.addShockwave(e.x, e.y + 18, e.type === "guardBoar" ? 78 : 62, 0.22, "rgba(255,190,80,0.56)", 5);
            }

            const burst = e.chargeBurst > 0 ? (e.type === "guardBoar" ? 1.85 : 2.25) : (e.type === "guardBoar" ? 0.55 : 0.78);
            const weave = Math.sin(e.age * 7 + e.wobble) * (e.type === "guardBoar" ? 18 : 34);
            e.x += (moveX * e.speed * burst + weave) * dt;
            e.y += moveY * e.speed * burst * dt;
          }

          if (e.type === "mushroom" || e.type === "scatterMushroom") {
            const distance = Math.sqrt(dx * dx + dy * dy);

            if (distance > 240) {
              e.x += moveX * e.speed * dt;
              e.y += moveY * e.speed * dt;
            } else {
              e.x -= moveX * e.speed * 0.35 * dt;
              e.y -= moveY * e.speed * 0.25 * dt;
            }

            e.shootTimer -= dt;

            if (e.shootTimer <= 0) {
              e.shootTimer = e.type === "scatterMushroom" ? rand(1.95, 2.75) : rand(1.7, 2.5);

              if (Math.random() <= (this.stage.enemyShotChance ?? 1) * this.getWeaponRelief().shot) {
                const spread = e.type === "scatterMushroom" ? 0.34 : 0.25;
                const shots = e.type === "scatterMushroom" ? 5 : 3;
                const first = -(shots - 1) / 2;

                for (let s = 0; s < shots; s++) {
                  const angle = Math.atan2(dy, dx) + (first + s) * spread;
                  const bulletSpeed = e.type === "scatterMushroom" ? 180 : 205;
                  this.fireEnemyBullet(e.x, e.y + 16, Math.cos(angle) * bulletSpeed, Math.sin(angle) * bulletSpeed, 8, 1);
                }

                this.addShockwave(e.x, e.y, 54, 0.25, "rgba(190,140,255,0.45)", 4);
              }
            }
          }

          if (e.type === "golemSlow") {
            const step = Math.sin(e.age * 5 + e.wobble) > 0 ? 1.15 : 0.75;
            e.x += moveX * e.speed * step * dt;
            e.y += moveY * e.speed * step * dt;

            if (Math.floor(e.age * 4) !== Math.floor((e.age - dt) * 4)) {
              this.addShockwave(e.x, e.y + 22, 34, 0.2, "rgba(180,150,110,0.42)", 3);
            }
          }

          if (e.type === "golemShooter" || e.type === "burstGolem") {
            const step = Math.sin(e.age * 4 + e.wobble) > 0 ? 0.85 : 0.58;
            e.x += moveX * e.speed * step * dt;
            e.y += moveY * e.speed * step * dt;
            e.shootTimer -= dt;

            if (e.shootTimer <= 0) {
              e.shootTimer = e.type === "burstGolem" ? rand(2.1, 2.8) : rand(1.55, 2.2);

              if (Math.random() <= (this.stage.enemyShotChance ?? 1) * this.getWeaponRelief().shot) {
                const angle = Math.atan2(dy, dx);
                const shots = e.type === "burstGolem" ? 6 : 3;
                const spread = e.type === "burstGolem" ? 0.32 : 0.18;
                const first = -(shots - 1) / 2;

                for (let s = 0; s < shots; s++) {
                  const shotAngle = angle + (first + s) * spread;
                  const bulletSpeed = e.type === "burstGolem" ? 160 : 185;
                  this.fireEnemyBullet(e.x, e.y + 20, Math.cos(shotAngle) * bulletSpeed, Math.sin(shotAngle) * bulletSpeed, 9, 1);
                }

                this.addShockwave(e.x, e.y, e.type === "burstGolem" ? 92 : 66, 0.28, "rgba(255,210,110,0.55)", 5);
              }
            }
          }

          if (e.x < -220 || e.x > W + 220 || e.y < -220 || e.y > H + 220) {
            this.enemies.splice(i, 1);
          }
        }
      }

      updatePowerups(dt) {
        const scrollSpeed = this.getScrollSpeed();

        for (let i = this.powerups.length - 1; i >= 0; i--) {
          const item = this.powerups[i];

          item.age += dt;
          item.life -= dt;
          item.y += scrollSpeed * 0.85 * dt;

          if (Math.random() < TRAIL_QUALITY) {
            this.addParticle({
              x: item.x + rand(-22, 22),
              y: item.y + rand(-22, 22),
              vx: rand(-20, 20),
              vy: rand(-80, -20),
              life: 0.35,
              color: item.type === "heal" ? "rgba(255,130,170,0.45)" : "rgba(120,255,130,0.45)",
              size: rand(2, 5),
              type: "spark",
            });
          }

          if (item.life <= 0 || item.y > H + 80) {
            this.powerups.splice(i, 1);
          }
        }
      }

      updateParticles(dt) {
        for (let i = this.particles.length - 1; i >= 0; i--) {
          const p = this.particles[i];

          p.x += p.vx * dt;
          p.y += p.vy * dt;
          p.life -= dt;
          p.vy += (p.gravity ?? 80) * dt;
          p.rot = (p.rot || 0) + (p.rotSpeed || 0) * dt;

          if (p.life <= 0) {
            this.particles.splice(i, 1);
          }
        }
      }

      updateFloatingTexts(dt) {
        for (let i = this.floatingTexts.length - 1; i >= 0; i--) {
          const t = this.floatingTexts[i];

          t.y -= 55 * dt;
          t.life -= dt;

          if (t.life <= 0) {
            this.floatingTexts.splice(i, 1);
          }
        }
      }

      updateShockwaves(dt) {
        for (let i = this.shockwaves.length - 1; i >= 0; i--) {
          const s = this.shockwaves[i];
          s.life -= dt;
          s.age += dt;

          if (s.life <= 0) {
            this.shockwaves.splice(i, 1);
          }
        }
      }

      updateSlashes(dt) {
        for (let i = this.slashes.length - 1; i >= 0; i--) {
          const s = this.slashes[i];
          s.life -= dt;
          s.age += dt;

          if (s.life <= 0) {
            this.slashes.splice(i, 1);
          }
        }
      }

      updateAmbientEffects(dt) {
        const ambient = this.getAmbientProfile();
        const tension = this.getBossTension();
        const chance = (ambient.chance + tension * 0.52) * EFFECT_QUALITY;

        if (Math.random() > chance) return;

        const count = Math.random() < ambient.burst + tension * 0.35 ? 2 : 1;

        if (ambient.kind === "magic") {
          for (let i = 0; i < count; i++) this.addMagicDust(tension);
          return;
        }

        if (ambient.kind === "ember") {
          for (let i = 0; i < count; i++) this.addMagicShard(tension);
          return;
        }

        for (let i = 0; i < count; i++) {
          this.addParticle({
            x: rand(30, W - 30),
            y: rand(0, H),
            vx: rand(-38, 38) * (1 + tension * 0.45),
            vy: rand(45, 105) * (1 + tension * 0.25),
            life: rand(1.35, 2.25),
            color: Math.random() < 0.55 ? "rgba(195,245,95,0.62)" : "rgba(125,225,85,0.52)",
            size: rand(6, 12) * (1 + tension * 0.35),
            type: "leaf",
            gravity: 8,
            rotSpeed: rand(-5, 5),
          });
        }
      }

      getAmbientProfile() {
        if (this.stageId === "castleFinal") return { kind: "ember", chance: 0.68, burst: 0.38 };
        if (this.stageId === "cave2" || this.stageId === "ruins3" || this.stageId === "fog4" || this.stageId === "worldTree5") {
          return { kind: "magic", chance: this.stageId === "cave2" ? 0.56 : 0.62, burst: 0.32 };
        }
        return { kind: "leaf", chance: this.stageId === "forest1" ? 0.28 : 0.32, burst: 0.08 };
      }

      addMagicDust(tension = 0) {
        const worldTree = this.stageId === "worldTree5";
        this.addParticle({
          x: rand(24, W - 24),
          y: rand(0, H),
          vx: rand(-16, 16),
          vy: rand(16, 54) * (1 + tension * 0.18),
          life: rand(0.9, 1.65),
          color: worldTree
            ? (Math.random() < 0.5 ? "rgba(150,255,200,0.66)" : "rgba(230,255,125,0.55)")
            : (Math.random() < 0.5 ? "rgba(150,230,255,0.62)" : "rgba(255,225,115,0.54)"),
          size: rand(1.5, 4.2) * (1 + tension * 0.45),
          type: Math.random() < 0.35 ? "diamond" : "circle",
          gravity: rand(-8, 8),
          rotSpeed: rand(-4, 4),
        });
      }

      addMagicShard(tension = 0) {
        this.addParticle({
          x: rand(30, W - 30),
          y: rand(0, H),
          vx: rand(-20, 20),
          vy: rand(38, 92) * (1 + tension * 0.35),
          life: rand(0.85, 1.55),
          color: Math.random() < 0.55 ? "rgba(255,50,85,0.82)" : "rgba(255,150,70,0.72)",
          size: rand(3, 8) * (1 + tension * 0.45),
          type: "diamond",
          gravity: rand(5, 55),
          rotSpeed: rand(-10, 10),
        });
      }

      checkCollisions() {
        const p = this.player;

        for (let i = this.bullets.length - 1; i >= 0; i--) {
          const b = this.bullets[i];
          let bulletUsed = false;

          for (let j = this.obstacles.length - 1; j >= 0; j--) {
            const o = this.obstacles[j];
            const rr = b.r + o.r;

            if (dist2(b.x, b.y, o.x, o.y) < rr * rr) {
              o.hp -= b.dmg;
              o.hitFlash = 0.12;
              o.burning = 0.75;
              bulletUsed = true;

              this.addBurnEffect(o.x, o.y);
              this.addShake(3);

              if (o.hp <= 0) {
                this.score += o.score;
                this.addFloatingText("+" + o.score, o.x, o.y, "#ffcf6b");
                this.burnTree(o.x, o.y);
                this.obstacles.splice(j, 1);
              }

              break;
            }
          }

          if (!bulletUsed) {
            for (let j = this.enemyBullets.length - 1; j >= 0; j--) {
              const eb = this.enemyBullets[j];
              const rr = b.r + eb.r;

              if (dist2(b.x, b.y, eb.x, eb.y) < rr * rr) {
                bulletUsed = true;
                if (eb.unbreakable) {
                  this.addBulletGuardEffect(eb.x, eb.y);
                } else {
                  this.enemyBullets.splice(j, 1);
                  this.addBulletBreakEffect(eb.x, eb.y);
                }
                break;
              }
            }
          }

          if (!bulletUsed) {
            for (let j = this.enemies.length - 1; j >= 0; j--) {
              const e = this.enemies[j];
              const rr = b.r + e.r;

              if (dist2(b.x, b.y, e.x, e.y) < rr * rr) {
                e.hp -= b.dmg;
                e.hitFlash = 0.1;
                bulletUsed = true;

                this.addHitEffect(e.x, e.y);

                if (e.hp <= 0) {
                  this.score += e.score;
                  this.addFloatingText("+" + e.score, e.x, e.y, "#d8ff8a");
                  this.addEnemyDefeatBurst(e);
                  playSound("enemyDefeat");
                  if (e.type === "splitSlime") {
                    this.spawnSplitlings(e);
                  }
                  this.enemies.splice(j, 1);
                } else {
                  playSound("enemyHit");
                }

                break;
              }
            }
          }

          const boss = this.boss;

          if (!bulletUsed && boss && boss.active) {
            const rr = b.r + boss.r;

            if (dist2(b.x, b.y, boss.x, boss.y) < rr * rr) {
              boss.hp -= b.dmg;
              boss.hitFlash = 0.12;
              bulletUsed = true;

              this.addHitEffect(b.x, b.y);
              this.addShake(4);

              if (boss.hp <= 0) {
                boss.active = false;
                this.bossDefeated = true;
                const bossScore = Math.round(2000 * (this.stage.scoreMultiplier || 1) * this.getLoopScoreMultiplier());
                this.score += bossScore;
                this.addFloatingText("+" + bossScore, boss.x, boss.y, "#fff58a");
                this.addBossDefeatBurst(boss);
                this.showMessage(this.t("中ボス撃破！ ゴールへ進め！", "Boss defeated! Head for the goal!"), 2.2);
                playSound("bossDefeat");
              } else {
                playSound("enemyHit");
              }
            }
          }

          if (bulletUsed) {
            this.bullets.splice(i, 1);
          }
        }

        for (let i = this.enemyBullets.length - 1; i >= 0; i--) {
          const b = this.enemyBullets[i];
          const rr = b.r + p.r;

          if (dist2(b.x, b.y, p.x, p.y) < rr * rr) {
            this.enemyBullets.splice(i, 1);
            this.damagePlayer();
          }
        }

        for (let i = this.obstacles.length - 1; i >= 0; i--) {
          const o = this.obstacles[i];
          const rr = o.r + p.r;

          if (dist2(o.x, o.y, p.x, p.y) < rr * rr) {
            this.damagePlayer();
            o.burning = 0.5;
            this.addBurnEffect(o.x, o.y);
            this.addFloatingText(this.t("木に衝突！", "Hit a tree!"), p.x, p.y - 70, "#ffb36b");

            const pushDir = p.x < o.x ? -1 : 1;
            p.x = clamp(p.x + pushDir * 48, 70, W - 70);
          }
        }

        for (let i = this.enemies.length - 1; i >= 0; i--) {
          const e = this.enemies[i];
          const rr = e.r + p.r;

          if (dist2(e.x, e.y, p.x, p.y) < rr * rr) {
            this.enemies.splice(i, 1);
            this.damagePlayer();
            this.addLootSparkles(e.x, e.y);
            this.explode(e.x, e.y, "rgba(255,120,80,0.9)", 22);
            this.addShockwave(e.x, e.y, 95, 0.38, "rgba(255,120,80,0.75)", 5);
          }
        }

        const boss = this.boss;
        if (boss && boss.active) {
          const rr = boss.r + p.r;

          if (dist2(boss.x, boss.y, p.x, p.y) < rr * rr) {
            this.damagePlayer();
          }
        }

        for (let i = this.powerups.length - 1; i >= 0; i--) {
          const item = this.powerups[i];
          const rr = item.r + p.r + (IS_MOBILE_DISPLAY ? 22 : 8);

          if (dist2(item.x, item.y, p.x, p.y) < rr * rr) {
            this.powerups.splice(i, 1);

            if (item.type === "heal") {
              if (p.hp < p.maxHp) {
                p.hp = clamp(p.hp + 1, 0, p.maxHp);
                this.addFloatingText("HP +1", p.x, p.y - 45, "#ff9fba");
                this.showMessage(this.t("HP回復！", "HP restored!"), 1.0);
                this.explode(item.x, item.y, "rgba(255,120,160,0.95)", 44);
                this.addShockwave(item.x, item.y, 130, 0.5, "rgba(255,140,180,0.8)", 6);
                this.addFlash("rgba(255,120,160,", 0.16);
                playSound("itemGet");
              }

              continue;
            }

            if (item.type === "overdrive") {
              const before = p.weaponLevel;
              p.weaponLevel = clamp(p.weaponLevel + 1, 1, 5);
              p.overdriveTime = 5;
              p.weaponDropBlockTime = 5;
              p.invuln = Math.max(p.invuln, 5);
              this.addFloatingText(
                before >= 5 ? this.t("MAX維持!", "MAX kept!") : this.t("武器Lv UP!", "Weapon Lv UP!"),
                p.x,
                p.y - 65,
                "#fff58a"
              );
              this.showMessage(this.t("5秒無敵！", "Invincible 5s!"), 1.2);
              this.explode(item.x, item.y, "rgba(255,245,120,0.95)", 68);
              this.addShockwave(item.x, item.y, 210, 0.68, "rgba(255,245,120,0.85)", 8);
              this.addFlash("rgba(255,245,120,", 0.24);
              playSound("itemGet");
              continue;
            }

            const before = p.weaponLevel;
            p.weaponLevel = clamp(p.weaponLevel + 1, 1, 5);

            if (p.weaponLevel > before) {
              this.addFloatingText(this.t("武器Lv UP!", "Weapon Lv UP!"), p.x, p.y - 45, "#8eff9a");
              this.showMessage(this.t("武器レベル " + p.weaponLevel + "！", "Weapon level " + p.weaponLevel + "!"), 1.1);
            } else {
              this.score += 300;
              this.addFloatingText("+300", p.x, p.y - 45, "#fff58a");
              this.showMessage(this.t("最大レベル！ ボーナス +300", "Max level! Bonus +300"), 1.1);
            }

            this.explode(item.x, item.y, "rgba(120,255,130,0.95)", 48);
            this.addShockwave(item.x, item.y, 145, 0.55, "rgba(120,255,130,0.8)", 6);
            this.addFlash("rgba(120,255,130,", 0.18);
            playSound("itemGet");
          }
        }
      }

      damagePlayer() {
        const p = this.player;

        if (p.invuln > 0) return;

        p.hp -= 1;
        p.invuln = 1.55;

        if (p.weaponLevel > 1) {
          p.weaponLevel -= 1;
          this.addFloatingText(this.t("武器Lv DOWN", "Weapon Lv DOWN"), p.x, p.y - 55, "#ffb36b");
        } else {
          p.weaponLevel = 1;
          this.addFloatingText(this.t("武器Lv MIN", "Weapon Lv MIN"), p.x, p.y - 55, "#ffd28a");
        }

        this.showMessage(this.t("ダメージ！", "Damage!"), 1.0);
        this.explode(p.x, p.y, "rgba(255,80,70,0.9)", 40);
        this.addShockwave(p.x, p.y, 135, 0.45, "rgba(255,80,70,0.75)", 7);
        this.addFlash("rgba(255,60,50,", 0.3);
        this.addShake(18);
        playSound("playerDamage");

        if (p.hp <= 0) {
          this.gameOver();
        }
      }
