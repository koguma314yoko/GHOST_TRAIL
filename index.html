      draw() {
        const sx = this.shake > 0 ? rand(-this.shake, this.shake) : 0;
        const sy = this.shake > 0 ? rand(-this.shake, this.shake) : 0;

        ctx.save();
        ctx.translate(sx, sy);

        this.drawBackground();

        if (this.state === "title") {
          ctx.restore();
          this.drawTitle();
          this.drawFlash();
          return;
        }

        if (this.state === "howto" || this.state === "ranking") {
          ctx.restore();
          this.drawTitleBackdrop();
          if (this.state === "howto") {
            this.drawHowTo();
          } else {
            this.drawRanking();
          }
          this.drawFlash();
          return;
        }

        this.drawGroundLightLines();
        this.drawObstacles();
        this.drawEnemies();
        this.drawBoss();
        this.drawPlayer();
        this.drawForeground();
        this.drawBossAtmosphere();
        this.drawStageFog();
        this.drawPowerups();
        this.drawBullets();
        this.drawEnemyBullets();
        this.drawPlayerGlow(this.player);
        this.drawSlashes();
        this.drawParticles();
        this.drawShockwaves();
        this.drawFloatingTexts();

        ctx.restore();

        this.drawUI();
        this.drawBossWarning();

        if (this.state === "gameover") {
          this.drawGameOver();
        }

        if (this.state === "branch") {
          this.drawBranch();
        }

        if (this.state === "complete") {
          this.drawComplete();
        }

        if (this.state === "pause") {
          this.drawPause();
        }

        this.drawFlash();
      }

      seededTileChoice(tileIndex, count) {
        if (count <= 1) return 0;
        const seed = Math.sin((tileIndex + 37) * 12.9898) * 43758.5453;
        return Math.floor((seed - Math.floor(seed)) * count);
      }

      drawBackground() {
        const stageBg = this.stage.bg || "forestBg";
        const bgKeys = [stageBg]
          .concat(this.stage.bgAlt ? [this.stage.bgAlt] : [])
          .concat(this.stage.bgVariants || [])
          .filter((key, index, arr) => key && arr.indexOf(key) === index && imageReady(key));

        if (bgKeys.length > 0) {
          const tileH = H;
          const scroll = this.bgScroll % tileH;
          const baseTile = Math.floor(this.bgScroll / tileH);

          for (let layer = -1; layer <= 1; layer++) {
            const tileIndex = baseTile - layer;
            const keyIndex = this.stage.bgRandomize
              ? this.seededTileChoice(tileIndex, bgKeys.length)
              : ((tileIndex % bgKeys.length) + bgKeys.length) % bgKeys.length;
            const key = bgKeys[keyIndex];
            const img = IMAGES[key];
            const y = Math.floor(scroll + layer * tileH);
            ctx.drawImage(img, 0, y, W, tileH + 1);

            const overlay = this.stage.bgOverlays?.[key];
            if (overlay && imageReady(overlay.key)) {
              ctx.save();
              ctx.globalAlpha = overlay.alpha ?? 1;
              ctx.drawImage(IMAGES[overlay.key], 0, y, W, tileH + 1);
              ctx.restore();
            }

            const globalOverlay = this.stage.bgGlobalOverlay;
            if (globalOverlay && imageReady(globalOverlay.key)) {
              const pulse = globalOverlay.flicker
                ? (Math.sin(performance.now() / (globalOverlay.flickerSpeed || 1000) + tileIndex * 1.7) + 1) * 0.5 * globalOverlay.flicker
                : 0;

              ctx.save();
              ctx.globalCompositeOperation = globalOverlay.blend || "source-over";
              ctx.globalAlpha = clamp((globalOverlay.alpha ?? 0.5) + pulse, 0, 1);
              ctx.drawImage(IMAGES[globalOverlay.key], 0, y, W, tileH + 1);
              ctx.restore();
            }
          }

          return;
        }

        if (stageBg !== "forestBg" && imageReady("forestBg")) {
          const img = IMAGES.forestBg;
          const tileH = H;
          const scroll = this.bgScroll % tileH;

          for (let layer = -1; layer <= 1; layer++) {
            const y = scroll + layer * tileH;
            ctx.drawImage(img, 0, y, W, tileH);
          }

          return;
        }

        if (imageReady("groundTile")) {
          this.drawGroundTile();
          return;
        }

        const g = ctx.createLinearGradient(0, 0, 0, H);
        g.addColorStop(0, "#12351d");
        g.addColorStop(0.55, "#1d4524");
        g.addColorStop(1, "#0b1c10");
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, W, H);

        const scroll = this.bgScroll % H;

        for (let layer = -1; layer <= 1; layer++) {
          const oy = scroll + layer * H;

          ctx.fillStyle = "rgba(120, 85, 45, 0.26)";
          ctx.beginPath();
          ctx.moveTo(W * 0.22, oy);
          ctx.quadraticCurveTo(W * 0.12, oy + H * 0.5, W * 0.24, oy + H);
          ctx.lineTo(W * 0.76, oy + H);
          ctx.quadraticCurveTo(W * 0.88, oy + H * 0.5, W * 0.78, oy);
          ctx.closePath();
          ctx.fill();

          ctx.strokeStyle = "rgba(210, 230, 150, 0.12)";
          ctx.lineWidth = 4;

          for (let i = 0; i < 8; i++) {
            const y = oy + i * 175 + 30;
            ctx.beginPath();
            ctx.moveTo(W * 0.26, y);
            ctx.quadraticCurveTo(W * 0.48, y + 80, W * 0.74, y + 10);
            ctx.stroke();
          }

          const fixedTrees = [
            { x: -8,  y: 80,   s: 0.9 },
            { x: 52,  y: 225,  s: 1.1 },
            { x: -18, y: 395,  s: 1.0 },
            { x: 58,  y: 585,  s: 1.18 },
            { x: -12, y: 780,  s: 0.95 },
            { x: 52,  y: 985,  s: 1.12 },
            { x: -8,  y: 1160, s: 1.0 },

            { x: 728, y: 105,  s: 0.98 },
            { x: 668, y: 275,  s: 1.15 },
            { x: 738, y: 455,  s: 0.95 },
            { x: 662, y: 650,  s: 1.08 },
            { x: 732, y: 850,  s: 1.0 },
            { x: 666, y: 1040, s: 1.15 },
            { x: 728, y: 1210, s: 0.9 },
          ];

          for (const t of fixedTrees) {
            this.drawTree(t.x, t.y + oy, t.s);
          }

          const fixedLeaves = [
            { x: 265, y: 120 }, { x: 420, y: 190 },
            { x: 315, y: 300 }, { x: 510, y: 370 },
            { x: 230, y: 510 }, { x: 465, y: 580 },
            { x: 340, y: 710 }, { x: 505, y: 810 },
            { x: 255, y: 930 }, { x: 430, y: 1030 },
            { x: 310, y: 1145 }, { x: 520, y: 1210 },
          ];

          ctx.fillStyle = "rgba(200,230,120,0.14)";

          for (const l of fixedLeaves) {
            ctx.beginPath();
            ctx.ellipse(l.x, l.y + oy, 8, 4, 0, 0, Math.PI * 2);
            ctx.fill();
          }
        }
      }

      drawGroundLightLines() {
        if (this.stageId !== "worldTree5" && this.stageId !== "castleFinal") return;

        const tension = this.getBossTension();
        const scroll = (this.bgScroll * 1.65) % 360;
        const isCastle = this.stageId === "castleFinal";
        const xs = isCastle ? [156, 284, 436, 568] : [184, 318, 462, 548];

        ctx.save();
        ctx.globalCompositeOperation = "lighter";

        for (let lane = 0; lane < xs.length; lane++) {
          const x = xs[lane] + Math.sin(performance.now() / 900 + lane) * 4;

          for (let i = -1; i < 5; i++) {
            const y = i * 360 + scroll + lane * 42;
            const phase = performance.now() / 650 + i + lane * 0.9;
            const alpha = (isCastle ? 0.18 : 0.15) + Math.sin(phase) * 0.035 + tension * 0.12;
            const len = isCastle ? 170 : 150;

            const grad = ctx.createLinearGradient(x, y, x, y + len);
            const main = isCastle ? "255,80,110" : "135,255,190";
            const core = isCastle ? "255,220,160" : "230,255,190";
            grad.addColorStop(0, "rgba(" + main + ",0)");
            grad.addColorStop(0.5, "rgba(" + main + "," + alpha + ")");
            grad.addColorStop(1, "rgba(" + main + ",0)");

            ctx.strokeStyle = grad;
            ctx.lineWidth = isCastle ? 3.5 : 3;
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x, y + len);
            ctx.stroke();

            ctx.strokeStyle = "rgba(" + core + "," + (alpha * 0.55) + ")";
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(x, y + len * 0.25);
            ctx.lineTo(x, y + len * 0.75);
            ctx.stroke();
          }
        }

        ctx.restore();
      }

      drawBossAtmosphere() {
        const tension = this.getBossTension();
        if (tension <= 0) return;

        const stagePower = this.stageId === "forest1" ? 0.45 : this.stageId === "river2" ? 0.6 : this.stageId === "castleFinal" ? 1.15 : 0.85;
        const pulse = (Math.sin(performance.now() / 150) + 1) * 0.5;

        ctx.save();
        ctx.globalCompositeOperation = "lighter";
        ctx.fillStyle = this.stageId === "castleFinal"
          ? "rgba(255,45,75," + (0.04 + tension * stagePower * (0.08 + pulse * 0.06)) + ")"
          : "rgba(255,230,120," + (0.025 + tension * stagePower * (0.05 + pulse * 0.035)) + ")";
        ctx.fillRect(0, 0, W, H);

        for (let i = 0; i < 4; i++) {
          const y = H * (0.18 + i * 0.17) + Math.sin(performance.now() / 280 + i) * 18;
          ctx.strokeStyle = this.stageId === "castleFinal"
            ? "rgba(255,50,80," + (0.12 * tension * stagePower) + ")"
            : "rgba(255,220,100," + (0.09 * tension * stagePower) + ")";
          ctx.lineWidth = 2 + i;
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(W, y + Math.sin(i + performance.now() / 320) * 30);
          ctx.stroke();
        }

        ctx.restore();
      }

      drawForeground() {
        const stageFg = this.stage.fg;
        if (!stageFg || !imageReady(stageFg)) return;

        const img = IMAGES[stageFg];
        const tileH = H;
        const scroll = (this.bgScroll * 1.28) % tileH;

        ctx.save();
        for (let layer = -1; layer <= 1; layer++) {
          const y = scroll + layer * tileH;
          ctx.drawImage(img, 0, y, W, tileH);
        }
        ctx.restore();
      }

      drawStageFog() {
        const fog = this.stage.fog;
        if (!fog || !imageReady(fog.key)) return;

        const tension = this.getBossTension();
        const img = IMAGES[fog.key];
        const tileH = H;
        const scroll = (this.bgScroll * (fog.speed || 0.6)) % tileH;
        const sway = Math.sin(performance.now() / 1800) * 26;

        ctx.save();
        ctx.globalAlpha = clamp((fog.alpha ?? 0.42) + tension * 0.22, 0, 0.82);

        for (let layer = -1; layer <= 1; layer++) {
          const y = scroll + layer * tileH;
          ctx.drawImage(img, sway - 46, y, W + 92, tileH);
        }

        ctx.restore();
      }

      drawGroundTile() {
        const img = IMAGES.groundTile;
        const tile = 256;
        const scroll = this.bgScroll % tile;

        ctx.fillStyle = "#315f23";
        ctx.fillRect(0, 0, W, H);

        for (let y = -tile + scroll; y < H + tile; y += tile) {
          for (let x = -tile; x < W + tile; x += tile) {
            ctx.drawImage(img, x, y, tile, tile);
          }
        }
      }

      drawSceneryTrees() {
        if (!this.sceneryTrees || (!imageReady("treeDeco1") && !imageReady("treeDeco2"))) return;

        const patternH = H * 3;
        const scroll = this.bgScroll % patternH;

        for (let repeat = -1; repeat <= 1; repeat++) {
          const offset = scroll + repeat * patternH;

          for (const t of this.sceneryTrees) {
            const key = imageReady(t.type) ? t.type : imageReady("treeDeco1") ? "treeDeco1" : "treeDeco2";
            const y = t.y + offset;
            if (y < -360 || y > H + 360) continue;

            const w = 190 * t.s;
            const h = 235 * t.s;

            ctx.save();
            ctx.translate(t.x, y);
            ctx.scale(t.mirror ? -1 : 1, 1);
            drawAsset(key, 0, 0, w, h);
            ctx.restore();
          }
        }
      }

      drawTree(x, y, s) {
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(s, s);

        ctx.fillStyle = "#4a2e19";
        roundRect(ctx, -12, 28, 24, 65, 8);
        ctx.fill();

        ctx.fillStyle = "#0c2812";
        ctx.beginPath();
        ctx.arc(-28, 28, 36, 0, Math.PI * 2);
        ctx.arc(10, 16, 42, 0, Math.PI * 2);
        ctx.arc(42, 34, 34, 0, Math.PI * 2);
        ctx.arc(0, -10, 38, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "rgba(45, 115, 45, 0.45)";
        ctx.beginPath();
        ctx.arc(-8, 8, 34, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }

      drawObstacles() {
        for (const o of this.obstacles) {
          this.drawObstacleTree(o);
        }
      }

      drawObstacleTree(o) {
        const alpha = o.hitFlash > 0 ? 0.65 : 1;

        if (drawAsset("treeObstacle", o.x, o.y, 132, 190, 0, alpha)) {
          if (o.burning > 0) {
            this.drawFireOverlay(o.x, o.y);
          }
          return;
        }

        ctx.save();
        ctx.translate(o.x, o.y);

        if (o.hitFlash > 0) {
          ctx.globalAlpha = 0.7;
        }

        ctx.fillStyle = o.hitFlash > 0 ? "#fff" : "#5a331b";
        roundRect(ctx, -16, 5, 32, 62, 10);
        ctx.fill();

        ctx.fillStyle = o.hitFlash > 0 ? "#fff" : "#153b17";
        ctx.beginPath();
        ctx.arc(-24, -8, 34, 0, Math.PI * 2);
        ctx.arc(0, -30, 42, 0, Math.PI * 2);
        ctx.arc(28, -6, 32, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "rgba(65,135,45,0.5)";
        ctx.beginPath();
        ctx.arc(-6, -20, 30, 0, Math.PI * 2);
        ctx.fill();

        ctx.globalAlpha = 1;

        if (o.burning > 0) {
          this.drawFireOverlay(0, -4, true);
        }

        ctx.restore();
      }

      drawFireOverlay(x, y, local = false) {
        if (!local) {
          ctx.save();
          ctx.translate(x, y);
        }

        const t = performance.now() / 100;

        ctx.fillStyle = "rgba(255,60,20,0.75)";
        ctx.beginPath();
        ctx.ellipse(Math.sin(t) * 5, -10, 28, 42, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "rgba(255,180,40,0.8)";
        ctx.beginPath();
        ctx.ellipse(Math.cos(t) * 4, -12, 16, 30, 0, 0, Math.PI * 2);
        ctx.fill();

        if (!local) {
          ctx.restore();
        }
      }

      drawPowerups() {
        for (const p of this.powerups) {
          const pulse = Math.sin(p.age * 8) * 0.12 + 1;

          if (p.type === "heal") {
            this.drawHealItem(p, pulse);
            continue;
          }

          if (p.type === "overdrive") {
            this.drawOverdriveItem(p, pulse);
            continue;
          }

          if (drawAsset("weaponItem", p.x, p.y, 58 * pulse, 58 * pulse)) {
            continue;
          }

          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.scale(pulse, pulse);

          ctx.fillStyle = "rgba(120,255,120,0.24)";
          ctx.beginPath();
          ctx.arc(0, 0, 42, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = "#75ff7a";
          ctx.beginPath();
          ctx.moveTo(0, -28);
          ctx.lineTo(24, 0);
          ctx.lineTo(0, 28);
          ctx.lineTo(-24, 0);
          ctx.closePath();
          ctx.fill();

          ctx.fillStyle = "#173b18";
          ctx.font = "bold 24px sans-serif";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText("武", 0, 1);

          ctx.restore();
        }
      }

      drawHealItem(p, pulse) {
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.scale(pulse, pulse);

        const grad = ctx.createRadialGradient(0, 0, 4, 0, 0, 46);
        grad.addColorStop(0, "rgba(255,255,255,0.8)");
        grad.addColorStop(0.5, "rgba(255,115,155,0.42)");
        grad.addColorStop(1, "rgba(255,115,155,0)");
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(0, 0, 46, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#ff5f8d";
        ctx.beginPath();
        ctx.moveTo(0, 24);
        ctx.bezierCurveTo(-36, 0, -24, -28, 0, -14);
        ctx.bezierCurveTo(24, -28, 36, 0, 0, 24);
        ctx.fill();

        ctx.fillStyle = "#fff";
        ctx.font = "900 24px sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("+", 0, -1);

        ctx.restore();
      }

      drawOverdriveItem(p, pulse) {
        if (drawAsset("overdriveItem", p.x, p.y, 70 * pulse, 70 * pulse)) {
          return;
        }

        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.scale(pulse, pulse);

        const grad = ctx.createRadialGradient(0, 0, 4, 0, 0, 56);
        grad.addColorStop(0, "rgba(255,255,255,0.95)");
        grad.addColorStop(0.45, "rgba(255,245,90,0.55)");
        grad.addColorStop(1, "rgba(255,160,50,0)");
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(0, 0, 56, 0, Math.PI * 2);
        ctx.fill();

        ctx.rotate(p.age * 3);
        ctx.fillStyle = "#fff58a";
        ctx.beginPath();
        for (let i = 0; i < 8; i++) {
          const a = -Math.PI / 2 + i * Math.PI / 4;
          const r = i % 2 === 0 ? 31 : 14;
          const x = Math.cos(a) * r;
          const y = Math.sin(a) * r;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = "#7b4a00";
        ctx.font = "900 18px sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("MAX", 0, 2);

        ctx.restore();
      }

      drawBullets() {
        for (const b of this.bullets) {
          if (drawAsset("bullet", b.x, b.y, b.r * 4.2, b.r * 4.2, b.angle)) {
            continue;
          }

          ctx.save();
          ctx.translate(b.x, b.y);

          const grad = ctx.createRadialGradient(0, 0, 2, 0, 0, b.r * 2.4);
          grad.addColorStop(0, "rgba(255,255,210,1)");
          grad.addColorStop(0.45, "rgba(190,255,120,0.9)");
          grad.addColorStop(1, "rgba(190,255,120,0)");

          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.arc(0, 0, b.r * 2.4, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = "#eaff9e";
          ctx.beginPath();
          ctx.arc(0, 0, b.r, 0, Math.PI * 2);
          ctx.fill();

          ctx.restore();
        }
      }

      drawEnemyBullets() {
        for (const b of this.enemyBullets) {
          if (!b.unbreakable && drawAsset("enemyBullet", b.x, b.y, b.r * 4.0, b.r * 4.0)) {
            continue;
          }

          ctx.save();
          ctx.translate(b.x, b.y);

          const grad = ctx.createRadialGradient(0, 0, 2, 0, 0, b.r * 2.6);
          if (b.unbreakable) {
            grad.addColorStop(0, "rgba(255,245,255,1)");
            grad.addColorStop(0.35, "rgba(255,60,140,0.95)");
            grad.addColorStop(1, "rgba(120,45,255,0)");
          } else {
            grad.addColorStop(0, "rgba(255,220,180,1)");
            grad.addColorStop(0.45, "rgba(255,85,65,0.9)");
            grad.addColorStop(1, "rgba(255,85,65,0)");
          }

          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.arc(0, 0, b.r * 2.6, 0, Math.PI * 2);
          ctx.fill();

          if (b.unbreakable) {
            ctx.strokeStyle = "rgba(255,235,255,0.82)";
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(0, 0, b.r * 1.48, 0, Math.PI * 2);
            ctx.stroke();
          }

          ctx.fillStyle = b.unbreakable ? "#ff4f9e" : "#ff684d";
          ctx.beginPath();
          ctx.arc(0, 0, b.r, 0, Math.PI * 2);
          ctx.fill();

          ctx.restore();
        }
      }

      drawEnemies() {
        for (const e of this.enemies) {
          if (e.type === "slime") this.drawSlime(e, "slimeSheet", "slime", 1.42);
          if (e.type === "slimeAlt") this.drawSlime(e, "slimeAltSheet", "slime", 1.5);
          if (e.type === "splitSlime") this.drawSlime(e, "slimeSplitSheet", "slime", 1.62);
          if (e.type === "bat") this.drawBat(e);
          if (e.type === "swarmBat") this.drawBat(e, 1.14);
          if (e.type === "boar") this.drawBoar(e, "boarSheet", "boar", 1.4);
          if (e.type === "boarAlt") this.drawBoar(e, "boarAltSheet", "boar", 1.5);
          if (e.type === "charger") this.drawBoar(e, "boarChargeSheet", "boar", 1.62);
          if (e.type === "guardBoar") this.drawBoar(e, "boarAltSheet", "boar", 1.72);
          if (e.type === "mushroom") this.drawMushroom(e);
          if (e.type === "scatterMushroom") this.drawMushroom(e, 1.12);
          if (e.type === "golemSlow") this.drawGolem(e, "golemSheet", 1.08);
          if (e.type === "golemShooter") this.drawGolem(e, "golemShooterSheet", 1.04);
          if (e.type === "burstGolem") this.drawGolem(e, "golemShooterSheet", 1.15);
        }
      }

      drawSlime(e, sheetKey = "slimeSheet", assetKey = "slime", visualScale = 1) {
        const w = Math.max(ENEMY_VISUAL_MIN_SIZE, e.r * 2.6 * visualScale);
        const h = Math.max(ENEMY_VISUAL_MIN_SIZE, e.r * 2.6 * visualScale);

        if (drawAnimatedAsset(sheetKey, e.x, e.y, w, h, {
          age: e.age,
          seed: e.wobble,
          alpha: e.hitFlash > 0 ? 0.65 : 1,
        })) {
          return;
        }

        if (drawAsset(assetKey, e.x, e.y, w, h, 0, e.hitFlash > 0 ? 0.65 : 1)) {
          return;
        }

        ctx.save();
        ctx.translate(e.x, e.y);

        const bounce = Math.sin(e.age * 8) * 3;

        ctx.fillStyle = e.hitFlash > 0 ? "#fff" : "#66c94d";
        ctx.beginPath();
        ctx.ellipse(0, bounce, e.r * 1.15, e.r * 0.88, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#153b17";
        ctx.beginPath();
        ctx.arc(-8, -3 + bounce, 4, 0, Math.PI * 2);
        ctx.arc(10, -3 + bounce, 4, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }

      drawBat(e, visualScale = 1) {
        const w = Math.max(ENEMY_VISUAL_MIN_SIZE * 1.18, e.r * 3.2 * 1.75 * visualScale);
        const h = Math.max(ENEMY_VISUAL_MIN_SIZE, e.r * 2.6 * 1.75 * visualScale);

        if (drawAnimatedAsset("batSheet", e.x, e.y, w, h, {
          age: e.age,
          seed: e.wobble,
          alpha: e.hitFlash > 0 ? 0.65 : 1,
        })) {
          return;
        }

        if (drawAsset("bat", e.x, e.y, w, h, 0, e.hitFlash > 0 ? 0.65 : 1)) {
          return;
        }

        ctx.save();
        ctx.translate(e.x, e.y);

        const flap = Math.sin(e.age * 16) * 10;

        ctx.fillStyle = e.hitFlash > 0 ? "#fff" : "#7043b8";
        ctx.beginPath();
        ctx.moveTo(-8, 2);
        ctx.lineTo(-42, -8 + flap);
        ctx.lineTo(-26, 18);
        ctx.lineTo(0, 10);
        ctx.lineTo(26, 18);
        ctx.lineTo(42, -8 - flap);
        ctx.lineTo(8, 2);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = e.hitFlash > 0 ? "#fff" : "#8c5cff";
        ctx.beginPath();
        ctx.ellipse(0, 2, 18, 22, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#ffe88a";
        ctx.beginPath();
        ctx.arc(-6, -4, 3, 0, Math.PI * 2);
        ctx.arc(6, -4, 3, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }

      drawBoar(e, sheetKey = "boarSheet", assetKey = "boar", visualScale = 1) {
        const w = Math.max(ENEMY_VISUAL_MIN_SIZE * 1.05, e.r * 3 * visualScale);
        const h = Math.max(ENEMY_VISUAL_MIN_SIZE, e.r * 2.4 * visualScale);

        if (drawAnimatedAsset(sheetKey, e.x, e.y, w, h, {
          age: e.age,
          seed: e.wobble,
          alpha: e.hitFlash > 0 ? 0.65 : 1,
        })) {
          return;
        }

        if (drawAsset(assetKey, e.x, e.y, w, h, 0, e.hitFlash > 0 ? 0.65 : 1)) {
          return;
        }

        ctx.save();
        ctx.translate(e.x, e.y);

        ctx.fillStyle = e.hitFlash > 0 ? "#fff" : "#8a5430";
        ctx.beginPath();
        ctx.ellipse(0, 0, e.r * 1.2, e.r * 0.85, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#5c331d";
        ctx.beginPath();
        ctx.ellipse(0, -12, e.r * 0.8, e.r * 0.55, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#fff0d0";
        ctx.beginPath();
        ctx.moveTo(-20, -6);
        ctx.lineTo(-34, 2);
        ctx.lineTo(-20, 6);
        ctx.closePath();
        ctx.moveTo(20, -6);
        ctx.lineTo(34, 2);
        ctx.lineTo(20, 6);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = "#17100b";
        ctx.beginPath();
        ctx.arc(-9, -15, 3, 0, Math.PI * 2);
        ctx.arc(9, -15, 3, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }

      drawMushroom(e, visualScale = 1) {
        const size = Math.max(ENEMY_VISUAL_MIN_SIZE, e.r * 2.9 * visualScale);

        if (drawAnimatedAsset("mushroomSheet", e.x, e.y, size, size, {
          age: e.age,
          seed: e.wobble,
          alpha: e.hitFlash > 0 ? 0.65 : 1,
        })) {
          return;
        }

        if (drawAsset("mushroom", e.x, e.y, size, size, 0, e.hitFlash > 0 ? 0.65 : 1)) {
          return;
        }

        ctx.save();
        ctx.translate(e.x, e.y);

        const bob = Math.sin(e.age * 5 + e.wobble) * 3;
        ctx.fillStyle = e.hitFlash > 0 ? "#fff" : "#f4e2c5";
        roundRect(ctx, -16, -2 + bob, 32, 34, 12);
        ctx.fill();

        ctx.fillStyle = e.hitFlash > 0 ? "#fff" : "#b45ce0";
        ctx.beginPath();
        ctx.ellipse(0, -18 + bob, 34, 22, 0, Math.PI, 0);
        ctx.fill();

        ctx.fillStyle = "#ffeef8";
        ctx.beginPath();
        ctx.arc(-12, -23 + bob, 5, 0, Math.PI * 2);
        ctx.arc(8, -28 + bob, 4, 0, Math.PI * 2);
        ctx.arc(16, -15 + bob, 3, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#3c2450";
        ctx.beginPath();
        ctx.arc(-6, 4 + bob, 3, 0, Math.PI * 2);
        ctx.arc(7, 4 + bob, 3, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }

      drawGolem(e, sheetKey = "golemSheet", visualScale = 1) {
        const size = Math.max(ENEMY_VISUAL_MIN_SIZE * 1.08, e.r * 2.9 * visualScale);

        if (drawAnimatedAsset(sheetKey, e.x, e.y, size, size, {
          age: e.age,
          seed: e.wobble,
          alpha: e.hitFlash > 0 ? 0.65 : 1,
        })) {
          return;
        }

        ctx.save();
        ctx.translate(e.x, e.y);

        const flash = e.hitFlash > 0;
        const stomp = Math.sin(e.age * 5 + e.wobble) * 2;

        ctx.fillStyle = "rgba(0,0,0,0.3)";
        ctx.beginPath();
        ctx.ellipse(0, 36, 42, 12, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = flash ? "#fff" : "#6e6455";
        roundRect(ctx, -28, -26 + stomp, 56, 64, 14);
        ctx.fill();

        ctx.fillStyle = flash ? "#fff" : "#8a806e";
        ctx.beginPath();
        ctx.arc(-17, -34 + stomp, 20, 0, Math.PI * 2);
        ctx.arc(17, -34 + stomp, 20, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#ffe36b";
        ctx.beginPath();
        ctx.arc(-10, -19 + stomp, 4, 0, Math.PI * 2);
        ctx.arc(10, -19 + stomp, 4, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = flash ? "#fff" : "#4a4035";
        ctx.lineWidth = 10;
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.moveTo(-30, 0 + stomp);
        ctx.lineTo(-50, 24);
        ctx.moveTo(30, 0 + stomp);
        ctx.lineTo(50, 24);
        ctx.stroke();

        ctx.restore();
      }

      drawBoss() {
        const b = this.boss;
        if (!b || !b.active) return;
        const sheetKey = this.stageId === "worldTree5" || this.stageId === "castleFinal"
          ? "bossForestSheetLate"
          : "bossForestSheet";
        const visualSize = b.r * 5.6;

        if (drawAnimatedAsset(sheetKey, b.x, b.y, visualSize, visualSize, {
          age: b.age,
          alpha: b.hitFlash > 0 ? 0.65 : 1,
        })) {
          return;
        }

        if (drawAsset("bossForest", b.x, b.y, visualSize, visualSize, 0, b.hitFlash > 0 ? 0.65 : 1)) {
          return;
        }

        ctx.save();
        ctx.translate(b.x, b.y);

        const flash = b.hitFlash > 0;
        const sway = Math.sin(b.age * 3) * 4;

        ctx.fillStyle = "rgba(0,0,0,0.25)";
        ctx.beginPath();
        ctx.ellipse(0, 82, 95, 25, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = flash ? "#fff" : "#5a351e";
        roundRect(ctx, -48, -10 + sway, 96, 135, 26);
        ctx.fill();

        ctx.fillStyle = flash ? "#fff" : "#244d20";
        ctx.beginPath();
        ctx.arc(-45, -35 + sway, 55, 0, Math.PI * 2);
        ctx.arc(0, -60 + sway, 70, 0, Math.PI * 2);
        ctx.arc(48, -30 + sway, 54, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = flash ? "#fff" : "#6a4628";
        ctx.lineWidth = 18;
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.moveTo(-44, 20 + sway);
        ctx.lineTo(-105, 75 + Math.sin(b.age * 4) * 10);
        ctx.moveTo(44, 20 + sway);
        ctx.lineTo(105, 75 + Math.cos(b.age * 4) * 10);
        ctx.stroke();

        ctx.fillStyle = "#ffdd5c";
        ctx.beginPath();
        ctx.arc(-22, -8 + sway, 8, 0, Math.PI * 2);
        ctx.arc(22, -8 + sway, 8, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = "#3a1e12";
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.moveTo(-20, 20 + sway);
        ctx.quadraticCurveTo(0, 35 + sway, 22, 20 + sway);
        ctx.stroke();

        ctx.restore();
      }

      drawPlayer() {
        const p = this.player;

        if (p.overdriveTime <= 0 && p.invuln > 0 && Math.floor(performance.now() / 80) % 2 === 0) {
          return;
        }

        const drewPlayerAsset = drawAnimatedAsset("playerSheet", p.x, p.y, 118, 118, {
          age: this.elapsed,
        }) || drawAsset("player", p.x, p.y, 118, 118);

        if (drewPlayerAsset) {
          ctx.fillStyle = "#fff";
          ctx.font = "bold 18px sans-serif";
          ctx.textAlign = "center";
          ctx.strokeStyle = "rgba(0,0,0,0.7)";
          ctx.lineWidth = 4;
          ctx.strokeText("Lv" + p.weaponLevel, p.x, p.y + 75);
          ctx.fillText("Lv" + p.weaponLevel, p.x, p.y + 75);
          return;
        }

        ctx.save();
        ctx.translate(p.x, p.y);

        ctx.fillStyle = "rgba(0,0,0,0.35)";
        ctx.beginPath();
        ctx.ellipse(0, 34, 28, 10, 0, 0, Math.PI * 2);
        ctx.fill();

        if (p.evadeTime > 0) {
          ctx.fillStyle = "rgba(120,220,255,0.35)";
          ctx.beginPath();
          ctx.ellipse(-p.evadeDir * 34, 5, 24, 44, 0, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.fillStyle = "#f3d2a2";
        ctx.beginPath();
        ctx.arc(0, -30, 17, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#2c6337";
        ctx.beginPath();
        ctx.moveTo(0, -12);
        ctx.lineTo(-25, 32);
        ctx.lineTo(25, 32);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = "#d9f7a3";
        ctx.beginPath();
        ctx.moveTo(0, -52);
        ctx.lineTo(13, -28);
        ctx.lineTo(-13, -28);
        ctx.closePath();
        ctx.fill();

        ctx.strokeStyle = "#caff7d";
        ctx.lineWidth = 5;
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.moveTo(18, -8);
        ctx.lineTo(42, -34);
        ctx.stroke();

        ctx.fillStyle = "#fff";
        ctx.font = "bold 18px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("Lv" + p.weaponLevel, 0, 58);

        ctx.restore();
      }

      drawPlayerGlow(p) {
        const pulse = Math.sin(this.elapsed * 8) * 0.08 + 1;
        const boost = p.overdriveTime > 0 ? 1.65 : p.evadeTime > 0 ? 1.35 : p.invuln > 0 ? 1.18 : 1;
        const r = 58 * pulse * boost;

        ctx.save();
        ctx.globalCompositeOperation = "lighter";

        const aura = ctx.createRadialGradient(p.x, p.y - 10, 8, p.x, p.y - 10, r);
        aura.addColorStop(0, p.overdriveTime > 0 ? "rgba(255,255,160,0.56)" : "rgba(255,245,150,0.34)");
        aura.addColorStop(0.45, p.overdriveTime > 0 ? "rgba(255,210,80,0.30)" : "rgba(155,245,120,0.18)");
        aura.addColorStop(1, "rgba(155,245,120,0)");
        ctx.fillStyle = aura;
        ctx.beginPath();
        ctx.arc(p.x, p.y - 10, r, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = p.overdriveTime > 0 ? "rgba(255,245,120,0.82)" : p.evadeTime > 0 ? "rgba(130,230,255,0.62)" : "rgba(230,255,140,0.42)";
        ctx.lineWidth = p.overdriveTime > 0 ? 6 : p.evadeTime > 0 ? 5 : 3;
        ctx.beginPath();
        ctx.ellipse(p.x, p.y + 3, 42 * pulse, 56 * pulse, 0, 0, Math.PI * 2);
        ctx.stroke();

        ctx.restore();

        if (p.overdriveTime > 0) {
          const glowTrailCount = Math.random() < TRAIL_QUALITY ? (IS_MOBILE_DISPLAY ? 1 : 3) : 0;
          for (let i = 0; i < glowTrailCount; i++) {
            this.addParticle({
              x: p.x + rand(-42, 42),
              y: p.y + rand(-58, 34),
              vx: rand(-50, 50),
              vy: rand(-120, -30),
              life: rand(0.18, 0.34),
              color: "rgba(255,240,120,0.78)",
              size: rand(3, 8),
              type: "spark",
            });
          }
        }

        ctx.save();
        ctx.fillStyle = "rgba(0,0,0,0.30)";
        ctx.beginPath();
        ctx.ellipse(p.x, p.y + 47, 34, 12, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      drawParticles() {
        for (const p of this.particles) {
          const a = clamp(p.life / p.maxLife, 0, 1);

          ctx.globalAlpha = a;
          ctx.fillStyle = p.color;

          if (p.type === "spark") {
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate(p.rot || 0);
            roundRect(ctx, -p.size * 0.45, -p.size * 2.0, p.size * 0.9, p.size * 4.0, p.size * 0.4);
            ctx.fill();
            ctx.restore();
          } else if (p.type === "leaf") {
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate(p.rot || 0);
            ctx.beginPath();
            ctx.ellipse(0, 0, p.size * 0.65, p.size * 1.35, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = "rgba(255,255,210,0.18)";
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(0, -p.size);
            ctx.lineTo(0, p.size);
            ctx.stroke();
            ctx.restore();
          } else if (p.type === "diamond") {
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate(p.rot || 0);
            ctx.beginPath();
            ctx.moveTo(0, -p.size);
            ctx.lineTo(p.size * 0.75, 0);
            ctx.lineTo(0, p.size);
            ctx.lineTo(-p.size * 0.75, 0);
            ctx.closePath();
            ctx.fill();
            ctx.restore();
          } else {
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fill();
          }

          ctx.globalAlpha = 1;
        }
      }

      drawShockwaves() {
        for (const s of this.shockwaves) {
          const t = 1 - s.life / s.maxLife;
          const r = s.maxR * t;
          const a = 1 - t;

          ctx.save();
          ctx.globalAlpha = a;
          ctx.strokeStyle = s.color;
          ctx.lineWidth = s.width;
          ctx.beginPath();
          ctx.arc(s.x, s.y, r, 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();
        }
      }

      drawSlashes() {
        for (const s of this.slashes) {
          const t = 1 - s.life / s.maxLife;
          const a = 1 - t;

          ctx.save();
          ctx.globalAlpha = a;
          ctx.translate(s.x, s.y);
          ctx.rotate(s.angle);

          ctx.strokeStyle = s.color;
          ctx.lineWidth = 12 * a;
          ctx.lineCap = "round";
          ctx.beginPath();
          ctx.arc(0, 0, s.size, -0.8, 0.8);
          ctx.stroke();

          ctx.strokeStyle = "rgba(255,255,255,0.65)";
          ctx.lineWidth = 4 * a;
          ctx.beginPath();
          ctx.arc(0, 0, s.size * 0.78, -0.72, 0.72);
          ctx.stroke();

          ctx.restore();
        }
      }

      drawFloatingTexts() {
        for (const t of this.floatingTexts) {
          ctx.globalAlpha = clamp(t.life, 0, 1);
          ctx.fillStyle = t.color;
          ctx.font = "bold 26px sans-serif";
          ctx.textAlign = "center";
          ctx.strokeStyle = "rgba(0,0,0,0.6)";
          ctx.lineWidth = 5;
          ctx.strokeText(t.text, t.x, t.y);
          ctx.fillText(t.text, t.x, t.y);
          ctx.globalAlpha = 1;
        }
      }

      wrapTextLines(text, maxWidth) {
        const words = text.split(" ");
        const lines = [];
        let line = "";
        words.forEach((word) => {
          const testLine = line ? line + " " + word : word;
          if (line && ctx.measureText(testLine).width > maxWidth) {
            lines.push(line);
            line = word;
          } else {
            line = testLine;
          }
        });
        if (line) lines.push(line);
        return lines;
      }

        const lines = this.lang === "ja"

        ctx.fillStyle = "#ffffff";

        ctx.textAlign = "left";

    const game = new Game();

    function pollGamepad() {
      if (!navigator.getGamepads) return;

      const pads = navigator.getGamepads();
      let gp = null;

      for (const pad of pads) {
        if (pad) {
          gp = pad;
          break;
        }
      }

      if (!gp) {
        input.gpLeft = false;
        input.gpRight = false;
        input.gpAttack = false;
        input.gamepadName = "";
        return;
      }

      input.gamepadName = gp.id || "Gamepad";

      const axisX = gp.axes[0] || 0;

      const dpadUp = gp.buttons[12]?.pressed || false;
      const dpadDown = gp.buttons[13]?.pressed || false;
      const dpadLeft = gp.buttons[14]?.pressed || false;
      const dpadRight = gp.buttons[15]?.pressed || false;

      input.gpLeft = axisX < -0.35 || dpadLeft;
      input.gpRight = axisX > 0.35 || dpadRight;

      const attackPressed =
        gp.buttons[0]?.pressed ||
        gp.buttons[2]?.pressed ||
        gp.buttons[7]?.pressed ||
        false;

      const evadePressed =
        gp.buttons[1]?.pressed ||
        gp.buttons[3]?.pressed ||
        gp.buttons[6]?.pressed ||
        false;

      const startPressed =
        gp.buttons[9]?.pressed ||
        gp.buttons[8]?.pressed ||
        false;

      input.gpAttack = attackPressed;

      if (attackPressed && !input.gpPrevAttack) {
        if (game.state === "pause") {
          game.confirmPauseSelection();
        } else if (game.state === "gameover") {
          game.confirmGameOverSelection();
        } else if (game.state === "howto" || game.state === "ranking") {
          game.backToTitle();
        } else if (game.state === "title" || game.state === "complete") {
          if (game.state === "complete") {
            game.advanceFromComplete();
          } else {
            game.confirmTitleSelection();
          }
        } else if (game.state === "branch") {
          if (game.selectedRoute) {
            game.startSelectedRoute();
          }
        }
      }

      if (evadePressed && !input.gpPrevEvade) {
        game.tryEvade();
      }

      if (startPressed && !input.gpPrevStart) {
        if (game.state === "playing" || game.state === "pause") {
          game.togglePause();
        } else if (game.state === "gameover") {
          game.confirmGameOverSelection();
        } else if (game.state === "howto" || game.state === "ranking") {
          game.backToTitle();
        } else if (game.state === "title" || game.state === "complete") {
          if (game.state === "complete") {
            game.advanceFromComplete();
          } else {
            game.confirmTitleSelection();
          }
        } else if (game.state === "branch") {
          if (game.selectedRoute) {
            game.startSelectedRoute();
          }
        }
      }

      if (game.state === "branch") {
        if ((dpadLeft || dpadUp) && !input.gpPrevLeftSelect) {
          game.chooseRouteByIndex(0);
        }

        if ((dpadRight || dpadDown) && !input.gpPrevRightSelect) {
          game.chooseRouteByIndex(1);
        }
      }

      if (game.state === "pause") {
        if ((dpadLeft || dpadUp) && !input.gpPrevLeftSelect) {
          game.movePauseSelection(-1);
        }

        if ((dpadRight || dpadDown) && !input.gpPrevRightSelect) {
          game.movePauseSelection(1);
        }
      }

      if (game.state === "gameover") {
        if ((dpadLeft || dpadUp) && !input.gpPrevLeftSelect) {
          game.moveGameOverSelection(-1);
        }

        if ((dpadRight || dpadDown) && !input.gpPrevRightSelect) {
          game.moveGameOverSelection(1);
        }
      }

      if (game.state === "title") {
        if (dpadUp && !input.gpPrevLeftSelect) {
          game.moveTitleSelection(-1);
        }

        if (dpadDown && !input.gpPrevRightSelect) {
          game.moveTitleSelection(1);
        }
      }

      input.gpPrevAttack = attackPressed;
      input.gpPrevEvade = evadePressed;
      input.gpPrevStart = startPressed;
      input.gpPrevLeftSelect = dpadLeft || dpadUp;
      input.gpPrevRightSelect = dpadRight || dpadDown;
    }

    function gameLoop(time) {
      const dt = game.lastTime ? (time - game.lastTime) / 1000 : 0;
      game.lastTime = time;

      pollGamepad();

      game.update(dt);
      syncLoopSounds(game, dt);
      game.draw();
      touchControls.classList.toggle("hidden", game.state !== "playing");
      topControls.classList.toggle("hidden", game.state !== "playing" && game.state !== "pause");
      evadeBtn.textContent = game.t("回避", "Evade");
      pauseBtn.textContent = game.state === "pause" ? game.t("再開", "Resume") : game.t("一時停止", "Pause");
      quitBtn.textContent = game.t("やめる", "Quit");
      quitBtn.classList.toggle("hidden", game.state !== "pause");

      requestAnimationFrame(gameLoop);
    }

    requestAnimationFrame(gameLoop);

    function getCanvasPos(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.clientX ?? e.touches?.[0]?.clientX ?? 0;
      const clientY = e.clientY ?? e.touches?.[0]?.clientY ?? 0;

      return {
        x: (clientX - rect.left) / rect.width * W,
        y: (clientY - rect.top) / rect.height * H,
      };
    }

    let movePointerId = null;
    let touchStartX = 0;
    let touchStartPlayerX = 0;

    function updateTouchMove(e) {
      const pos = getCanvasPos(e);
      if (IS_MOBILE_DISPLAY) {
        const sensitivity = 0.62;
        input.touchTargetX = clamp(touchStartPlayerX + (pos.x - touchStartX) * sensitivity, 70, W - 70);
        input.touchMoveActive = true;
        input.touchLeft = false;
        input.touchRight = false;
        return;
      }

      input.touchLeft = pos.x < W / 2;
      input.touchRight = pos.x >= W / 2;
    }

    function clearTouchMove() {
      movePointerId = null;
      input.touchLeft = false;
      input.touchRight = false;
      input.touchMoveActive = false;
      input.touchTargetX = null;
    }

      const pos = getCanvasPos(e);

      if (game.state === "title") {
        const menu = game.getTitleMenu();
        for (let i = 0; i < menu.length; i++) {
          const rect = game.getTitleMenuRect(i);
          if (pos.x >= rect.x && pos.x <= rect.x + rect.w && pos.y >= rect.y && pos.y <= rect.y + rect.h) {
            game.titleSelection = i;
            game.confirmTitleSelection();
            return;
          }
        }
        game.confirmTitleSelection();
        return;
      }

      if (game.state === "howto" || game.state === "ranking") {
        game.backToTitle();
        return;
      }

      if (game.state === "gameover") {
        if (pos.x >= 170 && pos.x <= 550 && pos.y >= 662 && pos.y <= 754) {
          game.gameOverSelection = 0;
          game.confirmGameOverSelection();
          return;
        }

        if (pos.x >= 170 && pos.x <= 550 && pos.y >= 782 && pos.y <= 874) {
          game.gameOverSelection = 1;
          game.confirmGameOverSelection();
          return;
        }

        game.confirmGameOverSelection();
        return;
      }

      if (game.state === "complete") {
        game.advanceFromComplete();
        return;
      }

      if (game.state === "pause") {
        if (pos.x >= 170 && pos.x <= 550 && pos.y >= 650 && pos.y <= 742) {
          game.resume();
          return;
        }

        if (pos.x >= 170 && pos.x <= 550 && pos.y >= 770 && pos.y <= 862) {
          game.quitToTitle();
          return;
        }

        return;
      }

      if (game.state === "branch") {
        if (pos.x >= 70 && pos.x <= 340 && pos.y >= 410 && pos.y <= 710) {
          game.chooseRouteByIndex(0);
          return;
        }

        if (pos.x >= 380 && pos.x <= 650 && pos.y >= 410 && pos.y <= 710) {
          game.chooseRouteByIndex(1);
          return;
        }

        if (pos.x >= 170 && pos.x <= 550 && pos.y >= 990 && pos.y <= 1082) {
          if (game.selectedRoute) {
            game.startSelectedRoute();
          } else {
            game.start();
          }
          return;
        }
      }

      if (game.state === "playing") {
        movePointerId = e.pointerId;
        touchStartX = pos.x;
        touchStartPlayerX = game.player?.x ?? W / 2;
        try {
          canvas.setPointerCapture(e.pointerId);
        } catch (err) {}
        updateTouchMove(e);
      }
    });

    canvas.addEventListener("pointermove", (e) => {
      if (game.state !== "playing" || e.pointerId !== movePointerId) return;
      e.preventDefault();
      updateTouchMove(e);
    });

    canvas.addEventListener("pointerup", (e) => {
      if (e.pointerId === movePointerId) {
        e.preventDefault();
        clearTouchMove();

    function bindHoldButton(id, onDown, onUp) {
      const el = document.getElementById(id);
      if (!el) return;

      const down = (e) => {
        e.preventDefault();
        el.classList.add("active");

        try {
          el.setPointerCapture(e.pointerId);
        } catch (err) {}

        onDown();
      };

      const up = (e) => {
        e.preventDefault();
        el.classList.remove("active");

        try {
          el.releasePointerCapture(e.pointerId);
        } catch (err) {}

        onUp();
      };

      el.addEventListener("pointerdown", down);
      el.addEventListener("pointerup", up);
      el.addEventListener("pointercancel", up);
    }

      input.gpLeft = false;
      input.gpRight = false;
      input.gpAttack = false;
      input.gamepadName = "";
    });

    window.addEventListener("blur", () => {
      input.keyLeft = false;
      input.keyRight = false;
      input.keyAttack = false;
      input.touchLeft = false;
      input.touchRight = false;
      input.touchAttack = false;
      input.gpLeft = false;
      input.gpRight = false;
      input.gpAttack = false;
    });
  </script>
</body>
</html>
